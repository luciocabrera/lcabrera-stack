packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true

# Supply chain security (https://pnpm.io/supply-chain-security)
blockExoticSubdeps: true

# Do NOT enable `enableGlobalVirtualStore` here. It was spiked and DECLINED:
# the global virtual store does not
# link rolldown's platform-specific native binding as a sibling of
# @voidzero-dev/vite-plus-core, so no `vp` command can load its task graph.
# Re-check that gap before reconsidering.

# A workspace dependency cycle is an architecture error (ADR-038); make it fail
# the install rather than the default warning that scrolls past unnoticed.
disallowWorkspaceCycles: true

# Dependencies are grouped by purpose (named catalogs) so a release-cohort shows
# and upgrades together. Add a new dependency to the group matching its role — a
# new lint plugin -> lint, a new @types/* -> types, a server library -> backend.
# Reference it from package.json as `catalog:<group>` (e.g. "react": "catalog:react").
catalogs:
  backend:
    pg: ^8.23.1

  build:
    # Both Babel entries stay on the major whose `@babel/core` the peer of
    # `vite-plugin-babel` accepts. The newer preset major peers on the newer
    # core, so neither can move until a `vite-plugin-babel` release accepts
    # that core. Moving only the preset leaves its core peer unmet, and its
    # options reject the `allExtensions`/`isTSX` the Babel configs pass.
    # Moving the core, alone or with the preset, leaves `vite-plugin-babel`'s
    # peer unmet.
    '@babel/core': ^7.29.7
    '@babel/preset-typescript': ^7.29.7
    # The ESLint toolchain gets TypeScript 6 from .pnpmfile.cjs, because
    # typescript-eslint has no TypeScript 7 support yet (ADR-139).
    typescript: ^7.0.2
    # `vite` is aliased to Vite+ core so the whole workspace resolves ONE Vite
    # instance — the `overrides` at the bottom redirect every `vite` edge here.
    # Without this, pnpm auto-installs upstream Vite to satisfy Vitest's `vite`
    # peer and the graph splits across separate Vite+, Vite, and Vitest copies.
    # Keep this in lockstep with the `vite-plus` version (same Vite+ release).
    # See node_modules/vite-plus/docs/guide/migrate-rules.md "Vite and Overrides".
    vite: npm:@voidzero-dev/vite-plus-core@1.4.0
    vite-plugin-babel: ^1.7.3
    vite-plus: 1.4.0
  lint:
    # Held on 2.5 until #1541: Biome 2.6 fails the Biome pass on this tree.
    '@biomejs/biome': ~2.5.15
    '@eslint/js': ^10.0.1
    '@typescript-eslint/rule-tester': ^8.72.1
    '@typescript-eslint/utils': ^8.72.1
    eslint: ^10.13.0
    eslint-config-prettier: ^10.1.8
    eslint-plugin-perfectionist: ^5.13.0
    eslint-plugin-react-dom: ^5.28.8
    eslint-plugin-react-hooks: ^7.1.1
    eslint-plugin-react-refresh: ^0.5.7
    eslint-plugin-react-x: ^5.28.8
    eslint-plugin-security: ^4.2.0
    eslint-plugin-unicorn: ^78.0.0
    globals: ^17.13.0
    react-doctor: ^0.9.18
    typescript-eslint: ^8.72.1

  react:
    '@react-router/dev': ^8.5.1
    '@react-router/node': ^8.5.1
    '@react-router/serve': ^8.5.1
    '@stylexjs/eslint-plugin': ^0.19.1
    '@stylexjs/stylex': ^0.19.1
    '@stylexjs/unplugin': ^0.19.1
    babel-plugin-react-compiler: ^1.0.0
    isbot: 5.2.1
    react: ^19.3.1
    react-dom: ^19.3.1
    react-markdown: ^10.1.0
    react-router: ^8.5.1

  runtime:
    zod: ^4.6.7

  test:
    '@anthropic-ai/claude-agent-sdk': ^0.3.312
    '@stryker-mutator/core': ^10.1.1
    '@testing-library/react': ^16.3.3
    jsdom: ^30.1.3
    '@playwright/test': ^1.64.1
    playwright: ^1.64.1
    # Both must be DECLARED to resolve, for different reasons, and neither is
    # safe to drop because "nothing imports it".
    #
    # `vitest`: showcase's `test:watch` invokes its binary by path, and pnpm
    # only materialises `node_modules/vitest` for a direct dep. Every other
    # test task runs `vp test`, which resolves the Vitest vite-plus depends on.
    #
    # `@vitest/coverage-v8`: an OPTIONAL PEER of vitest, which pnpm installs only
    # while some manifest declares it. The single root declaration is what holds
    # it for every workspace. Removing it needs a from-scratch lockfile and a
    # coverage run to justify — see
    # docs/decisions/ADR-047-declare-optional-peer-dependencies.md.
    '@vitest/coverage-v8': 5.0.5
    vitest: 5.0.5

  tooling:
    '@arethetypeswrong/core': ^0.18.5
    '@changesets/cli': ^3.0.3
    '@changesets/get-release-plan': ^5.0.2
    fallow: ^3.37.0
    knip: ^6.43.0
    lighthouse: ^13.6.0
    publint: ^0.3.25
    semver: ^7.8.5
    yaml: ^2.9.1
    ts-morph: ^28.0.0

  types:
    '@types/node': ^26.6.6
    '@types/pg': ^8.23.1
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
catalogMode: prefer
# Prune catalog entries that no package.json references, so the catalog cannot
# accumulate dead pins (default is `false`).
cleanupUnusedCatalogs: true
# Refuse to install on a Node outside the root `engines.node` band. Without this
# the field is advisory — pnpm ignores it, and nothing else reads it, so the
# declared floor held only while Vite+ managed the runtime and resolved `node`
# FROM that field. Under any other manager (nvm, fnm, a distro package) an
# install on an unsupported Node proceeded silently.
engineStrict: true
# pnpm installs no version younger than its `minimumReleaseAge`, 1440 minutes when
# unset, and this list is read against that default: every entry here installs
# the moment it is published. A resolving install that falls back to a younger
# version than the age allows appends it here as `name@version`; one that only
# reads `pnpm-lock.yaml` does not. A scope pattern is durable; a `name@version`
# entry is one-shot and stops matching the moment that package moves, becoming
# dead config that still reads as an active allowance. Prefer a pattern, and drop
# a pinned entry once its version is out of the tree (check `pnpm-lock.yaml`).
minimumReleaseAgeExclude:
  - '@types/*' # type-only packages have zero runtime attack surface
  - '@eslint-react/*' # lint-only packages with frequent coordinated releases

  - '@typescript-eslint/*'
  # The meta-package, which the scoped glob above does not match. It releases
  # in lockstep with the scoped ones, so the two must be listed together.
  - typescript-eslint

  - '@vitest/*'

  - '@babel/*'
  - '@fallow-cli/*'
  - '@react-router/*'

  - '@voidzero-dev/*'
  - vite-plus

# Redirect every `vite`/`vitest` edge to the toolchain catalog so the workspace
# resolves a single Vite+ instance (see the `build` catalog note above). The core
# alias does not satisfy plugins' `vite@^8` peer ranges, so allow any peer for
# these two — the single resolved version is the source of truth, not the range.
# The keys are `vite@*` and `vitest@*`: a bare key also matches a `catalog:`
# reference, and `vp up` then rewrites that reference to a concrete version.
overrides:
  # GHSA-2v37-7h3g-55p8 — nanoid's custom generators loop forever at size zero,
  # fixed in 3.3.17. Reached only through `postcss`, which asks for `^3.3.16` —
  # so the patch is already inside the range it accepts and this only lifts the
  # floor. Keyed `nanoid@3` rather than bare `nanoid`: the advisory is scoped to
  # the 3.x line, and an unscoped override would force a future 5.x consumer back
  # onto the 3.x line. Drop once postcss's own floor is >= 3.3.17.
  nanoid@3: ^3.3.20
  # GHSA-q8mj-m7cp-5q26, GHSA-4mjr-xmp4-gh2g, GHSA-x5fp-wj9c-mxmx — DoS and an
  # array-limit bypass in qs, all patched in 6.16.0. It reaches the tree through
  # `@stryker-mutator/core` -> `typed-rest-client`, which pins qs EXACTLY at
  # 6.15.1, so unlike the entries above this does not merely lift a floor inside
  # a range the parent accepts — it moves the parent off its pin. Same major, and
  # the 6.16 line already resolves here for express and body-parser, so it is
  # proven in this install. Drop once typed-rest-client repins.
  qs@6: ^6.17.0
  vite@*: catalog:build
  vitest@*: catalog:test
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

# trustPolicy: no-downgrade
