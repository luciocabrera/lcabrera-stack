packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true

# Supply chain security (https://pnpm.io/supply-chain-security)
blockExoticSubdeps: true

catalog:
  '@babel/preset-typescript': ^7.29.7
  '@eslint/js': ^10.0.1
  '@fastify/cors': ^11.2.0
  '@react-router/dev': ^7.17.0
  '@react-router/node': ^7.17.0
  '@react-router/serve': ^7.17.0
  '@stylexjs/eslint-plugin': ^0.18.3
  '@stylexjs/stylex': ^0.18.3
  '@stylexjs/unplugin': ^0.18.3
  '@testing-library/react': ^16.3.2
  '@types/cors': ^2.8.19
  '@types/express': ^5.0.6
  '@types/node': ^25.9.3
  '@types/pg': ^8.20.0
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  '@typescript-eslint/utils': ^8.61.0
  '@vitest/coverage-v8': ^4.1.8
  babel-plugin-react-compiler: ^1.0.0
  cors: ^2.8.6
  eslint: ^10.5.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-local-rules: ^3.0.2
  eslint-plugin-perfectionist: ^5.9.0
  eslint-plugin-react-dom: ^5.9.0
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.3
  eslint-plugin-react-x: ^5.9.0
  eslint-plugin-security: ^4.0.1
  eslint-plugin-unicorn: ^66.0.0
  express: ^5.2.1
  fallow: ^2.96.0
  fastify: ^5.8.5
  globals: ^17.6.0
  isbot: ^5.1.42
  jsdom: ^29.1.1
  knip: ^6.16.1
  lighthouse: ^13.4.0
  nodemon: ^3.1.14
  pg: ^8.21.0
  playwright: ^1.60.0
  react: ^19.2.7
  react-dom: ^19.2.7
  react-router: ^7.17.0
  typescript: ^6.0.3

  typescript-eslint: ^8.61.0
  vite: 8.0.16
  vite-plugin-babel: ^1.7.3
  vite-plus: ^0.1.24
  vitest: 4.1.8

  zod: ^4.4.3

catalogMode: prefer
# minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@types/*' # type-only packages have zero runtime attack surface
  - '@eslint-react/*' # lint-only packages with frequent coordinated releases
  - eslint-plugin-unicorn # lint-only package; package-level safeguard for CI policy resolution
  - eslint-plugin-react-dom # lint-only package
  - eslint-plugin-react-x # lint-only package
  - isbot@5.1.41
  - knip@6.16.0
  - eslint-plugin-unicorn@65.0.0
  - '@typescript-eslint/eslint-plugin@8.61.0'
  - '@typescript-eslint/parser@8.61.0'
  - '@typescript-eslint/project-service@8.61.0'
  - '@typescript-eslint/scope-manager@8.61.0'
  - '@typescript-eslint/tsconfig-utils@8.61.0'
  - '@typescript-eslint/type-utils@8.61.0'
  - '@typescript-eslint/types@8.61.0'
  - '@typescript-eslint/typescript-estree@8.61.0'
  - '@typescript-eslint/utils@8.61.0'
  - '@typescript-eslint/visitor-keys@8.61.0'
  - eslint-plugin-unicorn@65.0.1
  - isbot@5.1.42
  - typescript-eslint@8.61.0
  - lighthouse@13.4.0
  - eslint-plugin-security@4.0.1
  - eslint@10.5.0
  - eslint-plugin-react-refresh@0.5.3
  - eslint-plugin-unicorn@66.0.0

