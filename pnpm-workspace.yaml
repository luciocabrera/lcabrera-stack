packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true

# Supply chain security (https://pnpm.io/supply-chain-security)
blockExoticSubdeps: true

catalog:
  '@babel/preset-typescript': ^7.28.5
  '@eslint/js': ^10.0.1
  '@fastify/cors': ^11.2.0
  '@react-router/dev': ^7.15.1
  '@react-router/node': ^7.15.1
  '@react-router/serve': ^7.15.1
  '@stylexjs/eslint-plugin': ^0.18.3
  '@stylexjs/stylex': ^0.18.3
  '@stylexjs/unplugin': ^0.18.3
  '@tanstack/react-query': ^5.100.11
  '@tanstack/react-table': ^8.21.3
  '@tanstack/react-virtual': ^3.13.25
  '@testing-library/react': ^16.3.2
  '@types/cors': ^2.8.19
  '@types/express': ^5.0.6
  '@types/node': ^25.9.1
  '@types/pg': ^8.20.0
  '@types/react': ^19.2.15
  '@types/react-dom': ^19.2.3
  '@typescript-eslint/utils': ^8.59.4
  '@vitest/coverage-v8': ^4.1.7
  babel-plugin-react-compiler: ^1.0.0
  cors: ^2.8.6
  eslint: ^10.4.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-local-rules: ^3.0.2
  eslint-plugin-perfectionist: ^5.9.0
  eslint-plugin-react-dom: ^5.8.3
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.2
  eslint-plugin-react-x: ^5.8.3
  eslint-plugin-security: ^4.0.0
  eslint-plugin-unicorn: ^64.0.0
  express: ^5.2.1
  fastify: ^5.8.5
  globals: ^17.6.0
  isbot: ^5.1.40
  jsdom: ^29.1.1
  knip: ^6.14.1
  lighthouse: ^13.3.0
  nodemon: ^3.1.14
  pg: ^8.21.0
  playwright: ^1.60.0
  react: ^19.2.6
  react-dom: ^19.2.6
  react-router: ^7.15.1
  typescript: ^6.0.3

  typescript-eslint: ^8.59.4
  unplugin: ^3.0.0
  vite: 8.0.14
  vite-plugin-babel: ^1.7.3
  vite-plus: ^0.1.22
  vitest: 4.1.7

  zod: ^4.4.3

catalogMode: prefer
# minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@types/*' # type-only packages have zero runtime attack surface
  - '@tanstack/react-virtual@3.13.25'
  - '@tanstack/virtual-core@3.15.0'
  - vite@8.0.14

