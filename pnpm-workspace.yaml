packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true

# Supply chain security (https://pnpm.io/supply-chain-security)
blockExoticSubdeps: true

catalog:
  '@anthropic-ai/claude-agent-sdk': ^0.3.201
  '@babel/preset-typescript': ^8.0.1
  '@eslint/js': ^10.0.1
  '@fastify/cors': ^11.2.0
  '@react-router/dev': ^8.1.0
  '@react-router/node': ^8.1.0
  '@react-router/serve': ^8.1.0
  '@stylexjs/eslint-plugin': ^0.19.0
  '@stylexjs/stylex': ^0.19.0
  '@stylexjs/unplugin': ^0.19.0
  '@testing-library/react': ^16.3.2
  '@types/cors': ^2.8.19
  '@types/express': ^5.0.6
  '@types/node': ^26.1.0
  '@types/pg': ^8.20.0
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  '@typescript-eslint/utils': ^8.62.1
  '@vitest/coverage-v8': ^4.1.9
  babel-plugin-react-compiler: ^1.0.0
  cors: ^2.8.6
  eslint: ^10.6.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-local-rules: ^3.0.2
  eslint-plugin-perfectionist: ^5.9.1
  eslint-plugin-react-dom: ^5.11.0
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.3
  eslint-plugin-react-x: ^5.11.0
  eslint-plugin-security: ^4.0.1
  eslint-plugin-unicorn: ^70.0.0
  express: ^5.2.1
  fallow: ^3.0.0
  fastify: ^5.9.0
  globals: ^17.7.0
  isbot: 5.1.44
  jsdom: ^29.1.1
  knip: ^6.24.0
  lighthouse: ^13.4.0
  nodemon: ^3.1.14
  pg: ^8.22.0
  playwright: ^1.61.1
  react: ^19.2.7
  react-dom: ^19.2.7
  react-router: ^8.1.0
  typescript: ^6.0.3

  typescript-eslint: ^8.62.1
  vite: 8.1.3
  vite-plugin-babel: ^1.7.3
  vite-plus: ^0.2.2
  vitest: 4.1.9

  zod: ^4.4.3

catalogMode: prefer
# minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@types/*' # type-only packages have zero runtime attack surface
  - '@eslint-react/*' # lint-only packages with frequent coordinated releases

  - '@typescript-eslint/*'

  - '@vitest/*'

  - '@babel/*'
  - typescript-eslint@8.62.0 || 8.62.1
  - '@fallow-cli/*'

  - '@react-router/*'

  - '@voidzero-dev/*'
  - eslint-plugin-react-dom@5.10.1 || 5.10.2 || 5.10.3 || 5.11.0
  - eslint-plugin-react-x@5.10.1 || 5.10.2 || 5.10.3 || 5.11.0
  - vite-plus@0.2.2
  - fallow@3.0.0

