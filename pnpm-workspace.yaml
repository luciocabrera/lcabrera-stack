packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true

# Supply chain security (https://pnpm.io/supply-chain-security)
blockExoticSubdeps: true

# Do NOT enable `enableGlobalVirtualStore` here. It was spiked and DECLINED in
# an ADR that left with the CQMS extraction (#683): the global virtual store
# does not
# link rolldown's platform-specific native binding as a sibling of
# @voidzero-dev/vite-plus-core, so no `vp` command can load its task graph.
# Re-check that gap before reconsidering.

# A workspace dependency cycle is an architecture error (ADR-038); make it fail
# the install rather than the default warning that scrolls past unnoticed.
disallowWorkspaceCycles: true

# Dependencies are grouped by purpose (named catalogs) so a release-cohort shows
# and upgrades together. Add a new dependency to the group matching its role — a
# new lint plugin -> lint, a new @types/* -> types, a server library -> backend.
# Reference it from package.json as `catalog:<group>` (e.g. "react": "catalog:react").
catalogs:
  backend:
    pg: ^8.23.0

  build:
    '@babel/preset-typescript': ^8.0.1
    typescript: ^6.0.3
    # `vite` is aliased to Vite+ core so the whole workspace resolves ONE Vite
    # instance — the `overrides` at the bottom redirect every `vite` edge here.
    # Without this, pnpm auto-installs upstream Vite to satisfy Vitest's `vite`
    # peer and the graph splits across separate Vite+, Vite, and Vitest copies.
    # Keep this in lockstep with the `vite-plus` version (same Vite+ release).
    # See node_modules/vite-plus/docs/guide/migrate-rules.md "Vite and Overrides".
    vite: npm:@voidzero-dev/vite-plus-core@0.2.6
    vite-plugin-babel: ^1.7.3
    vite-plus: 0.2.6

  lint:
    '@biomejs/biome': ^2.5.7
    '@eslint/js': ^10.0.1
    '@typescript-eslint/rule-tester': ^8.67.0
    '@typescript-eslint/utils': ^8.67.0
    eslint: ^10.8.1
    eslint-config-prettier: ^10.1.8
    eslint-plugin-local-rules: ^3.0.2
    eslint-plugin-perfectionist: ^5.10.1
    eslint-plugin-react-dom: ^5.18.3
    eslint-plugin-react-hooks: ^7.1.1
    eslint-plugin-react-refresh: ^0.5.4
    eslint-plugin-react-x: ^5.18.3
    eslint-plugin-security: ^4.0.1
    eslint-plugin-unicorn: ^72.0.0
    globals: ^17.9.0
    react-doctor: ^0.9.11
    typescript-eslint: ^8.67.0

  react:
    '@react-router/dev': ^8.3.0
    '@react-router/node': ^8.3.0
    '@react-router/serve': ^8.3.0
    '@stylexjs/eslint-plugin': ^0.19.0
    '@stylexjs/stylex': ^0.19.0
    '@stylexjs/unplugin': ^0.19.0
    babel-plugin-react-compiler: ^1.0.0
    isbot: 5.2.1
    react: ^19.2.8
    react-dom: ^19.2.8
    react-markdown: ^10.1.0
    react-router: ^8.3.0

  runtime:
    zod: ^4.4.3

  test:
    '@testing-library/react': ^16.3.2
    jsdom: ^29.1.1
    playwright: ^1.62.1
    # Both must be DECLARED to resolve, for different reasons, and neither is
    # safe to drop because "nothing imports it".
    #
    # `vitest`: every workspace invokes its binary by path (`node
    # node_modules/vitest/vitest.mjs`, via vite.run.shared.config.ts), and pnpm
    # only materialises `node_modules/vitest` for a direct dep.
    #
    # `@vitest/coverage-v8`: an OPTIONAL PEER of vitest, which pnpm installs only
    # while some manifest declares it. The single root declaration is what holds
    # it for every workspace. Removing it needs a from-scratch lockfile and a
    # coverage run to justify — see
    # docs/decisions/ADR-047-declare-optional-peer-dependencies.md.
    '@vitest/coverage-v8': 4.1.10
    vitest: 4.1.10

  tooling:
    '@arethetypeswrong/core': ^0.18.5
    '@changesets/cli': ^2.31.1
    fallow: ^3.14.0
    knip: ^6.32.1
    lighthouse: ^13.4.1
    ts-morph: ^28.0.0

  types:
    '@types/node': ^26.2.0
    '@types/pg': ^8.21.0
    '@types/react': ^19.2.18
    '@types/react-dom': ^19.2.4
catalogMode: prefer
# Prune catalog entries that no package.json references, so the catalog cannot
# accumulate dead pins (default is `false`).
cleanupUnusedCatalogs: true
# Refuse to install on a Node outside the root `engines.node` band. Without this
# the field is advisory — pnpm ignores it, and nothing else reads it, so the
# declared floor held only while Vite+ managed the runtime and resolved `node`
# FROM that field. Under any other manager (nvm, fnm, a distro package) an
# install on an unsupported Node proceeded silently.
engineStrict: true
# minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@types/*' # type-only packages have zero runtime attack surface
  - '@eslint-react/*' # lint-only packages with frequent coordinated releases

  - '@typescript-eslint/*'

  - '@vitest/*'

  - '@babel/*'
  - '@fallow-cli/*'
  - '@react-router/*'

  - '@voidzero-dev/*'
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.218'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.218'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.218'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.218'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.218'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.218'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.218'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.218'
  - '@anthropic-ai/claude-agent-sdk@0.3.218'
  - eslint-plugin-react-dom@5.18.0
  - eslint-plugin-react-x@5.18.0
  - fallow@3.8.0
  - knip@6.29.0
  - react-router@8.3.0
  - vite-plus@0.2.6

# Redirect every `vite`/`vitest` edge to the toolchain catalog so the workspace
# resolves a single Vite+ instance (see the `build` catalog note above). The core
# alias does not satisfy plugins' `vite@^8` peer ranges, so allow any peer for
# these two — the single resolved version is the source of truth, not the range.
overrides:
  vite: catalog:build
  vitest: catalog:test
  # GHSA-2v37-7h3g-55p8 — nanoid's custom generators loop forever at size zero,
  # fixed in 3.3.17. Reached only through `postcss`, which asks for `^3.3.16` —
  # so the patch is already inside the range it accepts and this only lifts the
  # floor. Keyed `nanoid@3` rather than bare `nanoid`: the advisory is scoped to
  # the 3.x line, and an unscoped override would force a future 5.x consumer back
  # onto the 3.x line. Drop once postcss's own floor is >= 3.3.17.
  nanoid@3: ^3.3.18
  # GHSA-5p4m-2wfm-xmqj — quadratic CPU consumption resolving `!!omap`, present
  # in BOTH live major lines and not backported, so it needs two entries: 3.x
  # arrives via `read-yaml-file` (asks `^3.6.1`), 4.x via `@changesets/parse`
  # (asks `^4.1.1`). Both patches sit inside the range their parent already
  # declares. Neither is declared by any workspace, so `vp update js-yaml` is a
  # no-op and an override is the only lever. Drop each once its parent's floor
  # clears the patched version.
  js-yaml@3: ^3.15.1
  js-yaml@4: ^4.3.1
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

# `eslint-plugin-perfectionist` reaches for the TypeScript compiler API with a
# bare `createRequire(import.meta.url)('typescript')` while declaring no
# `typescript` dependency or peer of its own. pnpm therefore links none into its
# isolated `node_modules`, Node's resolution walks up to the hidden hoist store
# (`node_modules/.pnpm/node_modules/typescript`), and lands on whichever build is
# hoisted there.
#
# That is `typescript@7.0.2` — the native Go port pulled in by vite-plus, whose
# `"."` export is `lib/version.cjs` and exposes only `{version,
# versionMajorMinor}`. So `isExternalModuleNameRelative` is `undefined` and the
# ENTIRE eslint pass dies with a TypeError on the first import it sorts, in every
# workspace, exiting 2 rather than reporting findings (#472).
#
# Declaring the peer here makes pnpm link the catalog's `typescript` instead.
# Optional, because the plugin degrades gracefully when TypeScript is genuinely
# absent — it falls back to a `startsWith('.')` heuristic — and a hard peer would
# turn that into an install error. `vp run lint:eslint:verify` is the guard:
# it plants a misordered import and fails if the rule does not report it, because
# a crashing pass and a clean pass are indistinguishable from the exit code alone.
#
# Do not "fix" this by pinning typescript back — 7.0.2 is legitimately vite-plus's
# (tsgolint). Upstream should declare the peer itself.
packageExtensions:
  eslint-plugin-perfectionist:
    peerDependencies:
      typescript: '*'
    peerDependenciesMeta:
      typescript:
        optional: true

# trustPolicy: no-downgrade
