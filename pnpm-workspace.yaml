packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true

# Supply chain security (https://pnpm.io/supply-chain-security)
blockExoticSubdeps: true

catalog:
  '@babel/preset-typescript': ^7.28.5
  '@eslint/js': ^10.0.1
  '@fastify/cors': ^11.2.0
  '@react-router/dev': ^7.14.0
  '@react-router/node': ^7.14.0
  '@react-router/serve': ^7.14.0
  '@stylexjs/eslint-plugin': ^0.18.2
  '@stylexjs/stylex': ^0.18.2
  '@stylexjs/unplugin': ^0.18.2
  '@tanstack/react-query': ^5.97.0
  '@tanstack/react-table': ^8.21.3
  '@tanstack/react-virtual': ^3.13.23
  '@testing-library/react': ^16.3.2
  '@types/cors': ^2.8.19
  '@types/express': ^5.0.6
  '@types/node': ^25.6.0
  '@types/pg': ^8.20.0
  '@types/react': ^19.2.14
  '@types/react-dom': ^19.2.3
  '@typescript-eslint/utils': ^8.58.1
  babel-plugin-react-compiler: ^1.0.0
  cors: ^2.8.6
  eslint: ^10.2.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-local-rules: ^3.0.2
  eslint-plugin-perfectionist: ^5.8.0
  eslint-plugin-react-dom: ^4.2.3
  eslint-plugin-react-hooks: ^7.0.1
  eslint-plugin-react-refresh: ^0.5.2
  eslint-plugin-react-x: ^4.2.3
  eslint-plugin-security: ^4.0.0
  eslint-plugin-unicorn: ^64.0.0
  express: ^5.2.1
  fastify: ^5.8.4
  globals: ^17.4.0
  isbot: ^5.1.37
  jsdom: ^29.0.2
  knip: ^6.3.1
  nodemon: ^3.1.14
  pg: ^8.20.0
  react: ^19.2.5
  react-dom: ^19.2.5
  react-router: ^7.14.0
  typescript: ^6.0.2

  typescript-eslint: ^8.58.1
  unplugin: ^3.0.0
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plugin-babel: ^1.6.0
  vite-plus: ^0.1.18
  vitest: npm:@voidzero-dev/vite-plus-test@latest

  zod: ^4.3.6

catalogMode: prefer
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@types/*' # type-only packages have zero runtime attack surface
# overrides:
#   vite: "catalog:"
#   vitest: "catalog:"
# peerDependencyRules:
#   allowAny:
#     - vite
#     - vitest
#   allowedVersions:
#     vite: "*"
#     vitest: "*"
trustPolicy: no-downgrade
