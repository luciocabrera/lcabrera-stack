packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true

# Supply chain security (https://pnpm.io/supply-chain-security)
blockExoticSubdeps: true

catalog:
  '@anthropic-ai/claude-agent-sdk': ^0.3.215
  '@babel/preset-typescript': ^8.0.1
  '@eslint/js': ^10.0.1
  '@fastify/cors': ^11.3.0
  '@react-router/dev': ^8.2.0
  '@react-router/node': ^8.2.0
  '@react-router/serve': ^8.2.0
  '@stylexjs/eslint-plugin': ^0.19.0
  '@stylexjs/stylex': ^0.19.0
  '@stylexjs/unplugin': ^0.19.0
  '@testing-library/react': ^16.3.2
  '@types/cors': ^2.8.19
  '@types/express': ^5.0.6
  '@types/node': ^26.1.1
  '@types/pg': ^8.20.0
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3

  '@types/ws': ^8.18.1
  '@typescript-eslint/utils': ^8.64.0
  '@vitest/coverage-v8': ^4.1.10

  babel-plugin-react-compiler: ^1.0.0
  cors: ^2.8.6
  eslint: ^10.7.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-local-rules: ^3.0.2
  eslint-plugin-perfectionist: ^5.10.0
  eslint-plugin-react-dom: ^5.17.3
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.3
  eslint-plugin-react-x: ^5.17.3
  eslint-plugin-security: ^4.0.1
  eslint-plugin-unicorn: ^72.0.0
  express: ^5.2.1
  fallow: ^3.7.1
  fastify: ^5.10.0
  globals: ^17.7.0
  isbot: 5.2.1
  jsdom: ^29.1.1
  knip: ^6.27.0
  lighthouse: ^13.4.0
  nodemon: ^3.1.14
  pg: ^8.22.0
  playwright: ^1.61.1
  react: ^19.2.7
  react-dom: ^19.2.7
  react-markdown: ^10.1.0
  ts-morph: ^28.0.0
  ws: ^8.21.1
  react-router: ^8.2.0
  typescript: ^6.0.3

  typescript-eslint: ^8.64.0
  vite: 8.1.5
  vite-plugin-babel: ^1.7.3
  vite-plus: ^0.2.5
  vitest: 4.1.10

  zod: ^4.4.3
  fflate: ^0.8.3
  '@biomejs/biome': ^2.5.4
  '@typescript-eslint/rule-tester': ^8.64.0

catalogMode: prefer
# minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@types/*' # type-only packages have zero runtime attack surface
  - '@eslint-react/*' # lint-only packages with frequent coordinated releases

  - '@typescript-eslint/*'

  - '@vitest/*'

  - '@babel/*'
  - '@fallow-cli/*'
  - '@react-router/*'

  - '@voidzero-dev/*'
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.214 || 0.3.215'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.214 || 0.3.215'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.214 || 0.3.215'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.214 || 0.3.215'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.214 || 0.3.215'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.214 || 0.3.215'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.214 || 0.3.215'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.214 || 0.3.215'
  - '@anthropic-ai/claude-agent-sdk@0.3.214 || 0.3.215'
  - eslint-plugin-react-dom@5.17.3
  - eslint-plugin-react-x@5.17.3
  - fallow@3.7.1

