packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true

# Supply chain security (https://pnpm.io/supply-chain-security)
blockExoticSubdeps: true

# Do NOT enable `enableGlobalVirtualStore` here. It was spiked and DECLINED
# (docs/cqms/decisions/ADR-044): the experimental global virtual store does not
# link rolldown's platform-specific native binding as a sibling of
# @voidzero-dev/vite-plus-core, so no `vp` command can load its task graph.
# Re-check that gap before reconsidering.

# A workspace dependency cycle is an architecture error (ADR-038); make it fail
# the install rather than the default warning that scrolls past unnoticed.
disallowWorkspaceCycles: true

# Dependencies are grouped by purpose (named catalogs) so a release-cohort shows
# and upgrades together. Add a new dependency to the group matching its role — a
# new lint plugin -> lint, a new @types/* -> types, a server library -> backend.
# Reference it from package.json as `catalog:<group>` (e.g. "react": "catalog:react").
catalogs:
  backend:
    '@fastify/cors': ^11.3.0
    cors: ^2.8.6
    express: ^5.2.1
    fastify: ^5.10.0
    nodemon: ^3.1.14
    pg: ^8.22.0
    ws: ^8.21.1

  build:
    '@babel/preset-typescript': ^8.0.1
    typescript: ^6.0.3
    # `vite` is aliased to Vite+ core so the whole workspace resolves ONE Vite
    # instance — the `overrides` at the bottom redirect every `vite` edge here.
    # Without this, pnpm auto-installs upstream Vite to satisfy Vitest's `vite`
    # peer and the graph splits across separate Vite+, Vite, and Vitest copies.
    # Keep this in lockstep with the `vite-plus` version (same Vite+ release).
    # See node_modules/vite-plus/docs/guide/migrate-rules.md "Vite and Overrides".
    vite: npm:@voidzero-dev/vite-plus-core@0.2.6
    vite-plugin-babel: ^1.7.3
    vite-plus: 0.2.6

  lint:
    '@biomejs/biome': ^2.5.5
    '@eslint/js': ^10.0.1
    '@typescript-eslint/rule-tester': ^8.65.0
    '@typescript-eslint/utils': ^8.65.0
    eslint: ^10.7.0
    eslint-config-prettier: ^10.1.8
    eslint-plugin-local-rules: ^3.0.2
    eslint-plugin-perfectionist: ^5.10.0
    eslint-plugin-react-dom: ^5.18.0
    eslint-plugin-react-hooks: ^7.1.1
    eslint-plugin-react-refresh: ^0.5.3
    eslint-plugin-react-x: ^5.18.0
    eslint-plugin-security: ^4.0.1
    eslint-plugin-unicorn: ^72.0.0
    globals: ^17.7.0
    typescript-eslint: ^8.65.0

  react:
    '@react-router/dev': ^8.3.0
    '@react-router/node': ^8.3.0
    '@react-router/serve': ^8.3.0
    '@stylexjs/eslint-plugin': ^0.19.0
    '@stylexjs/stylex': ^0.19.0
    '@stylexjs/unplugin': ^0.19.0
    babel-plugin-react-compiler: ^1.0.0
    isbot: 5.2.1
    react: ^19.2.8
    react-dom: ^19.2.8
    react-markdown: ^10.1.0
    react-router: ^8.3.0

  runtime:
    '@anthropic-ai/claude-agent-sdk': ^0.3.218
    fflate: ^0.8.3
    zod: ^4.4.3

  test:
    '@testing-library/react': ^16.3.2
    jsdom: ^29.1.1
    playwright: ^1.61.1
    # `vitest` stays cataloged because every workspace invokes its binary by path
    # (`node node_modules/vitest/vitest.mjs`, via vite.run.shared.config.ts), which
    # needs a resolvable direct dep. `@vitest/coverage-v8` is deliberately NOT here:
    # vitest resolves the v8 provider from vite-plus's own tree at runtime, so a
    # per-workspace/catalog pin is redundant (a workspace can run coverage without
    # declaring it). Do not re-add it. See #357.
    vitest: 4.1.10

  tooling:
    '@changesets/cli': ^2.31.1
    fallow: ^3.8.0
    knip: ^6.29.0
    lighthouse: ^13.4.1
    ts-morph: ^28.0.0

  types:
    '@types/cors': ^2.8.19
    '@types/express': ^5.0.6
    '@types/node': ^26.1.1
    '@types/pg': ^8.20.0
    '@types/react': ^19.2.17
    '@types/react-dom': ^19.2.3
    '@types/ws': ^8.18.1
catalogMode: prefer
# Prune catalog entries that no package.json references, so the catalog cannot
# accumulate dead pins (default is `false`).
cleanupUnusedCatalogs: true
# minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@types/*' # type-only packages have zero runtime attack surface
  - '@eslint-react/*' # lint-only packages with frequent coordinated releases

  - '@typescript-eslint/*'

  - '@vitest/*'

  - '@babel/*'
  - '@fallow-cli/*'
  - '@react-router/*'

  - '@voidzero-dev/*'
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.218'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.218'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.218'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.218'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.218'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.218'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.218'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.218'
  - '@anthropic-ai/claude-agent-sdk@0.3.218'
  - eslint-plugin-react-dom@5.18.0
  - eslint-plugin-react-x@5.18.0
  - fallow@3.8.0
  - knip@6.29.0
  - react-router@8.3.0
  - vite-plus@0.2.6

# Redirect every `vite`/`vitest` edge to the toolchain catalog so the workspace
# resolves a single Vite+ instance (see the `build` catalog note above). The core
# alias does not satisfy plugins' `vite@^8` peer ranges, so allow any peer for
# these two — the single resolved version is the source of truth, not the range.
overrides:
  vite: catalog:build
  vitest: catalog:test
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

# trustPolicy: no-downgrade
