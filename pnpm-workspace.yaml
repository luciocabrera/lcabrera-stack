packages:
  - apps/*

catalog:
  "@types/cors": ^2.8.19
  "@types/express": ^5.0.6
  "@types/node": ^25.5.0
  "@types/pg": ^8.20.0
  typescript: ^6.0.2
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest

catalogMode: prefer
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
