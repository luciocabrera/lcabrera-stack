# SonarQube Cloud — Automatic Analysis configuration.
#
# This file, NOT `sonar-project.properties`. SonarQube Cloud ignores
# `sonar-project.properties` entirely when a project runs in Automatic Analysis
# mode, which this one does (the GitHub App analyses each push server-side —
# there is no scanner step in this repo). It is read from the DEFAULT BRANCH
# only, so a change here does nothing until it is merged to `main`.
#
# Wildcard patterns are not supported here. That rules out the obvious
# `sonar.exclusions=…/migrations/**`, and is why the fix below is expressed as a
# language setting instead of a path exclusion.

# Stop claiming `.sql` for the Oracle PL/SQL analyser.
#
# Every `.sql` file in this repository is PostgreSQL: the CQMS migrations
# (packages/scan-ingestion/src/db/migrations), the enterprise-orders and
# large-data setup scripts (apps/api-server/db), and the local seed dump
# (docker/local). None of it is Oracle PL/SQL, and SonarQube Cloud has no
# PostgreSQL analyser — so the `.sql` default suffix means these files are read
# by an analyser for a language they are not written in.
#
# The findings that produces are wrong-dialect opinions rather than defects, and
# some of them cannot all be satisfied at once. On #73 a view that filters on a
# table without selecting its columns was caught between JoinConditionNumberCheck
# (at most 3 joins) and plsql:S1138 ("eliminate EXISTS") — the two rules demand
# opposite rewrites. plsql:S1192 also fired on `'queued'` / `'running'` repeated
# across function bodies, where repetition is how the state machine reads.
#
# Because the strict issue gate fails on ANY open issue, every future migration
# PR would have to contort correct PostgreSQL to satisfy an Oracle analyser. #73
# worked around it in the SQL itself; that does not scale.
#
# The Oracle-specific suffixes are kept: if genuine PL/SQL is ever added here, it
# is still analysed. Only the `.sql` claim is dropped. Default value is
# `sql,pls,plb,pks,pkb`.
sonar.plsql.file.suffixes=pls,plb,pks,pkb
