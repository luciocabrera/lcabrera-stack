# SonarQube Cloud — Automatic Analysis configuration.
#
# This file, NOT `sonar-project.properties`. SonarQube Cloud ignores
# `sonar-project.properties` entirely when a project runs in Automatic Analysis
# mode, which this one does (the GitHub App analyses each push server-side —
# there is no scanner step in this repo). It is read from the DEFAULT BRANCH
# only, so a change here does nothing until it is merged to `main`.
#
# Wildcard patterns are not supported here. That rules out the obvious
# `sonar.exclusions=…/migrations/**`.
#
# The file intentionally carries no settings. What was here and why it went is
# below, because both halves of that story are easy to get wrong again.
#
# ---------------------------------------------------------------------------
# HISTORY — the PL/SQL suffix setting, and two mistaken beliefs behind it (#75)
#
# Every `.sql` file in this repository is PostgreSQL. When this was written
# there were three sources: a second product's migrations, the demo setup
# scripts, and a local seed dump, all living together in one API workspace.
# #689 split that DDL so each side owns the tables it serves, and the other two
# sources left the repository — leaving only the showcase's own setup scripts. SonarQube Cloud claims `.sql` for its **Oracle
# PL/SQL** analyser by default, so all of it was read as a language it is not
# written in — 70 findings that were wrong-dialect opinions rather than defects,
# including `VarcharUsageCheck` demanding VARCHAR2, which does not exist in
# PostgreSQL. Some could not all be satisfied at once: on #73 a view was caught
# between JoinConditionNumberCheck's 3-join limit and plsql:S1138's "eliminate
# EXISTS", which demand opposite rewrites. With the strict issue gate failing
# on ANY open issue, every future migration PR would have had to contort
# correct PostgreSQL to satisfy an Oracle analyser.
#
# The fix attempted here was `sonar.plsql.file.suffixes=pls,plb,pks,pkb`. It
# never took effect, and the comment defending it was wrong twice — each error
# worth recording, because each sent the fix somewhere useless:
#
#  1. It asserted SonarQube Cloud "has no PostgreSQL analyser". It has one: a
#     Deterministic Rule Engine, `sonar.dre.postgres.activate`, enabled by
#     default, with its own `pgsql,psql` suffixes. Believing otherwise made
#     "rename the files so nothing analyses them" look like the best available
#     option, when analysing them *correctly* was on the table the whole time.
#  2. It stated the PL/SQL default as `sql,pls,plb,pks,pkb`. The real default
#     is `sql,tab,pkb` — so the value written here would have silently dropped
#     `tab` had it applied at all.
#
# Language suffix properties are evidently not applied from this file under
# Automatic Analysis. The working mechanism is the SonarCloud UI:
#
#   Administration → Languages → PL/SQL → File Suffixes      (remove `sql`)
#   Administration → Languages → PostgreSQL → File Suffixes  (add `sql`)
#
# Do not re-add a `sonar.plsql.file.suffixes` line here expecting it to work.
# If the PL/SQL findings ever return, check those two UI settings first.
# ---------------------------------------------------------------------------
#
# ---------------------------------------------------------------------------
# THE ACTUAL CONFIGURATION LIVES IN THE SONARCLOUD UI (mirrored here, 2026-07-22)
#
# Because this file cannot hold it — wildcards unsupported, language properties
# ignored — the whole configuration is invisible to anyone reading the repo.
# This block is the mirror. It is a COPY, not the source of truth: change the
# UI, then update this. If the two disagree, the UI wins and this is stale.
#
# Administration → Languages → File Suffixes
#   PL/SQL       tab, pkb                 (default is `sql,tab,pkb`; `sql` removed)
#   PostgreSQL   pgsql, psql, sql         (default is `pgsql,psql`; `sql` added)
#
#   Together these hand every `.sql` file to the PostgreSQL Deterministic Rule
#   Engine instead of the Oracle analyser — the actual fix for #75. Neither
#   half works alone: dropping `sql` from PL/SQL without adding it to
#   PostgreSQL leaves the migrations analysed by nothing at all, which trades
#   wrong-dialect noise for a blind spot over the entire schema.
#
# Administration → Analysis Scope → Source File Exclusions (`sonar.exclusions`)
#   **/build/**                          build output
#   **/packages/eslint-local-rules/build  build output
#   **/*.test.ts, **/*.test.tsx          test files
#   **/*.examples.tsx                    component example fixtures
#   a departed API workspace's db/     demo seed scripts (setup_large_data)
#   **/docker/local/nestjs_backup.sql    a database dump, not source
#
#   ALL THREE ARE OUT OF DATE, and only the UI can fix it:
#     - add    **/apps/react-router/db/**   the showcase's demo seed scripts —
#              setup_enterprise_orders moved there under #689 (ADR-071)
#     - remove the departed API workspace's db/ glob — it now matches nothing
#              in the repository
#     - remove **/docker/local/nestjs_backup.sql   the dump is deleted; an
#              exclusion matching nothing is just noise for the next reader
#
# ---------------------------------------------------------------------------
