id: trigger-build-verify-loop
name: Build and verify until it passes
set: capability
tags:
  - positive-trigger
inputs:
  prompt: "Work issue #9999 with a builder and a verifier, looping back to the
    builder on every FAIL until the verifier passes it. Tell me what you
    would do first. Load any skill you need, but don't run shell commands or
    edit files."
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-refactor-verified
    config:
      mode: any_order
      required_skills:
        - refactor-verified
