name: typescript-api-engineering-trigger
description: Does typescript-api-engineering load when designing a TypeScript HTTP API, and stay out of a TypeScript syntax question?
skill: typescript-api-engineering
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 240
  executor: copilot-sdk
  model: claude-sonnet-5.5
  inject_skill_body: false
