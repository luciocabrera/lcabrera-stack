id: trigger-new-rest-service
name: Laying out a new REST service
set: capability
tags:
  - positive-trigger
inputs:
  prompt: "We are starting a new Node.js TypeScript REST API for invoices. Lay out how you would structure it: schemas, validation, auth and versioning. Tell me what you would do first. Load any skill you need, but don't run shell commands or edit files."
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-typescript-api-engineering
    config:
      mode: any_order
      required_skills:
        - typescript-api-engineering
