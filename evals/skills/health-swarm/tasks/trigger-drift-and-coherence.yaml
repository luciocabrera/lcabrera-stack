id: trigger-drift-and-coherence
name: Doc drift and lint-config coherence, verified and fixed
set: capability
tags:
  - positive-trigger
inputs:
  prompt:
    Look across the whole repo for documentation that no longer matches the
    code and lint configs that contradict each other; verify each finding and
    fix the mechanical ones in PRs. Tell me what you would do first. Load any
    skill you need, but don't run shell commands or edit files.
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-health-swarm
    config:
      mode: any_order
      required_skills:
        - health-swarm
