id: trigger-months-later
name: Checking what decayed over months
set: capability
tags:
  - positive-trigger
inputs:
  prompt:
    Nobody has looked at this codebase as a whole for months. Find whatever
    has decayed, docs that drifted, unused dependencies, slow paths, and file
    issues for what is real. Tell me what you would do first. Load any skill you
    need, but don't run shell commands or edit files.
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-health-swarm
    config:
      mode: any_order
      required_skills:
        - health-swarm
