id: trigger-before-refactor
name: A sweep before a large refactor
set: capability
tags:
  - positive-trigger
inputs:
  prompt: Before we start a large refactor of the packages, I want a broad sweep
    for duplication, dead code, stale docs and dependency rot, with evidence
    behind each finding. Tell me what you would do first. Load any skill you
    need, but don't run shell commands or edit files.
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-health-swarm
    config:
      mode: any_order
      required_skills:
        - health-swarm
