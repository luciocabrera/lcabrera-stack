id: trigger
name: Auditing what has rotted
tags:
  - positive-trigger
inputs:
  prompt: "Run a periodic health audit of this repository: what has rotted here? Tell me what you would do first. Load any skill you need, but don't run shell commands or edit files."
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-health-swarm
    config:
      mode: any_order
      required_skills:
        - health-swarm
