name: epic-trigger
description: Does epic load when asked to run, resume or wave-plan an epic through agents and blind review, and stay out of planning vocabulary, issue writing and single-issue edits?
skill: epic
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 240
  executor: copilot-sdk
  model: claude-sonnet-5.5
  inject_skill_body: false
  skill_directories:
    - ../../../.github/skills
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 1.0
    description: The skill loaded when it should and not when it should not.
tasks:
  - 'tasks/*.yaml'
