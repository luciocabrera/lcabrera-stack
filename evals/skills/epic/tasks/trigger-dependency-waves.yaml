id: trigger-dependency-waves
name: Ordering an epic's issues into waves
set: capability
tags:
  - positive-trigger
inputs:
  prompt:
    "Work through epic #9999: work out which of its issues block which, then
    start the first batch of agents on the ones nothing blocks. Tell me what
    you would do first. Load any skill you need, but don't run shell
    commands or edit files."
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-epic
    config:
      mode: any_order
      required_skills:
        - epic
