id: trigger-run-from-scratch
name: Running an epic from its open issues
set: capability
tags:
  - positive-trigger
inputs:
  prompt:
    "Epic #9999 has twelve open sub-issues and nobody has started on it. Run
    it end to end until everything is merged on main. Tell me what you would
    do first. Load any skill you need, but don't run shell commands or edit
    files."
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-epic
    config:
      mode: any_order
      required_skills:
        - epic
