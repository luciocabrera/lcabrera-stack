id: trigger-blind-review-merge
name: Agents, blind review and merging for an epic
set: capability
tags:
  - positive-trigger
inputs:
  prompt: "Take the remaining sub-issues of epic #9999: hand each one to a
    developer agent, have every PR reviewed by someone who did not write it,
    and merge only what clears the bar. Tell me what you would do first.
    Load any skill you need, but don't run shell commands or edit files."
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-epic
    config:
      mode: any_order
      required_skills:
        - epic
