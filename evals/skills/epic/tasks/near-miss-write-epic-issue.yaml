id: near-miss-write-epic-issue
name: Writing the epic issue itself
set: capability
tags:
  - negative-trigger
inputs:
  prompt: Draft the body of a new GitHub issue that would serve as an epic for
    adding dark mode. Just the text, three short paragraphs. Load any skill
    you need, but don't run shell commands or edit files.
expected:
  should_trigger: false
graders:
  - type: skill_invocation
    name: leaves-epic-alone
    config:
      forbidden_skills:
        - epic
