id: near-miss-spelling
name: Spelling one word
set: capability
tags:
  - negative-trigger
inputs:
  prompt: >-
    How do you spell the plural of 'index' in American English technical
    writing? One word. Load any skill you need, but don't run shell commands
    or edit files.
expected:
  should_trigger: false
graders:
  - type: skill_invocation
    name: leaves-unslop-alone
    config:
      forbidden_skills:
        - unslop
