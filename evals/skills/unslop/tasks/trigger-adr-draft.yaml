id: trigger-adr-draft
name: Drafting the context section of an ADR
set: capability
tags:
  - positive-trigger
inputs:
  prompt: >-
    Write the context section of an ADR explaining why we moved the
    column-filter types out of the shared package and duplicated them in two
    packages. Keep it to one paragraph. Load any skill you need, but don't
    run shell commands or edit files.
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-unslop
    config:
      mode: any_order
      required_skills:
        - unslop
