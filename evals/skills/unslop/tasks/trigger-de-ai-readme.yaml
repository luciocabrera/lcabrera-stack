id: trigger-de-ai-readme
name: De-AI a README section
set: capability
tags:
  - positive-trigger
inputs:
  prompt: >-
    De-AI this README intro before I commit it: 'Welcome to our comprehensive
    toolkit! Whether you are a seasoned developer or just getting started,
    this library has you covered every step of the way.' Load any skill you
    need, but don't run shell commands or edit files.
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-unslop
    config:
      mode: any_order
      required_skills:
        - unslop
