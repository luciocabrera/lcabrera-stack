id: trigger-cleanup-list
name: Building a dead-code cleanup list
set: regression
tags:
  - positive-trigger
inputs:
  prompt: "Find the files nobody imports anymore, the unused dependencies and the duplicated code blocks across the monorepo, and give me a prioritized cleanup list; tell me what you would do first. Load any skill you need, but don't run shell commands or edit files."
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-fallow-code-checker
    config:
      mode: any_order
      required_skills:
        - fallow-code-checker
