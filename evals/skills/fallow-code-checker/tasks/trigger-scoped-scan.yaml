id: trigger-scoped-scan
name: Scanning one workspace with fallow
set: regression
tags:
  - positive-trigger
inputs:
  prompt: "Run fallow on apps/showcase only and give me an evidence-based report of what it finds; tell me what you would do first. Load any skill you need, but don't run shell commands or edit files."
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-fallow-code-checker
    config:
      mode: any_order
      required_skills:
        - fallow-code-checker
