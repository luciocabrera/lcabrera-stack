id: trigger
name: Running a full dead-code scan
set: regression
tags:
  - positive-trigger
inputs:
  prompt: "Run a full fallow scan of the repo and give me a prioritized report of dead code and unused exports; tell me what you would do first. Load any skill you need, but don't run shell commands or edit files."
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-fallow-code-checker
    config:
      mode: any_order
      required_skills:
        - fallow-code-checker
