id: trigger-uncommitted-changes
name: Checking uncommitted changes for smells
set: capability
tags:
  - positive-trigger
inputs:
  prompt: "Look over my uncommitted changes for code quality problems. Is anything in them smelly that I should clean up before I commit? Tell me what you would do first. Load any skill you need, but don't run shell commands or edit files."
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-code-smell-zen
    config:
      mode: any_order
      required_skills:
        - code-smell-zen
