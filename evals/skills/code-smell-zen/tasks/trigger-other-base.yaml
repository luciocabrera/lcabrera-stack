id: trigger-other-base
name: Reviewing a diff against a non-default base
set: capability
tags:
  - positive-trigger
inputs:
  prompt: "My feature branch was cut from origin/develop. Compare it against that branch and flag any smells the diff introduces; tell me what you would do first. Load any skill you need, but don't run shell commands or edit files."
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-code-smell-zen
    config:
      mode: any_order
      required_skills:
        - code-smell-zen
