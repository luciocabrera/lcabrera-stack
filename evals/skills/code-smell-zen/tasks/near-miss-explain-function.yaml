id: near-miss-explain-function
name: Explaining a function from a diff
set: capability
tags:
  - negative-trigger
inputs:
  prompt: "This function showed up in my diff. What does it do? Two sentences: const pick = (o, ks) => Object.fromEntries(ks.filter((k) => k in o).map((k) => [k, o[k]])); Load any skill you need, but don't run shell commands or edit files."
expected:
  should_trigger: false
graders:
  - type: skill_invocation
    name: leaves-code-smell-zen-alone
    config:
      forbidden_skills:
        - code-smell-zen
