name: store-pattern-trigger
description: Does store-pattern load for a stateful grid's subscriptions, re-renders, external store and split actions, and stay out of reading the same file's names, fields and defaults?
skill: store-pattern
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 240
  executor: copilot-sdk
  model: claude-sonnet-5.5
  inject_skill_body: false
  skill_directories:
    - ../../../.github/skills
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 1.0
    description: The skill loaded when it should and not when it should not.
tasks:
  - 'tasks/*.yaml'
