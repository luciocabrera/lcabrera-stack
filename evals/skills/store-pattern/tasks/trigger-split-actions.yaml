id: trigger-split-actions
name: 'Keeping dispatch-only components from re-rendering'
set: capability
tags:
  - positive-trigger
inputs:
  prompt: "Read src/contexts/GridContext.tsx. The toolbar buttons only change the grid's state and never read it, yet they re-render on every change. Separate what they need from the state. Tell me what you would do first. Load any skill you need, but don't run shell commands or edit files."
  context:
    fixture: grid
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-store-pattern
    config:
      mode: any_order
      required_skills:
        - store-pattern
