id: trigger-sort-rerenders
name: 'Stopping every cell re-rendering on sort'
set: capability
tags:
  - positive-trigger
inputs:
  prompt: "Read src/contexts/GridContext.tsx. Every cell in the grid re-renders when the sort changes. Restructure this state so a component re-renders only when the part it reads changes. Tell me what you would do first. Load any skill you need, but don't run shell commands or edit files."
  context:
    fixture: grid
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-store-pattern
    config:
      mode: any_order
      required_skills:
        - store-pattern
