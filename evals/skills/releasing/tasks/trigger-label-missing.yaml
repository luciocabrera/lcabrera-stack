id: trigger-label-missing
name: A PR label the labeler never applied
set: capability
tags:
  - positive-trigger
inputs:
  prompt: >-
    Our labeler workflow didn't put any type label on my PR, and I want to
    add a new label to the taxonomy so it does. How do I do that here? Load
    any skill you need, but don't run shell commands or edit files.
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-releasing
    config:
      mode: any_order
      required_skills:
        - releasing
