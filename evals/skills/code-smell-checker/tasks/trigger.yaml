id: trigger
name: Auditing a package for smells
set: regression
tags:
  - positive-trigger
inputs:
  prompt: "Audit packages/ui for code smells and give me a prioritized tech-debt list; tell me what you would do first. Load any skill you need, but don't run shell commands or edit files."
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-code-smell-checker
    config:
      mode: any_order
      required_skills:
        - code-smell-checker
