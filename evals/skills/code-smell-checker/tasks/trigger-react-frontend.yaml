id: trigger-react-frontend
name: Sweeping a React package for smells
set: capability
tags:
  - positive-trigger
inputs:
  prompt: "Our React components in packages/ui feel bloated. Sweep the entire package for smells such as prop drilling, oversized components and feature envy, and give me a prioritized list; tell me what you would do first. Load any skill you need, but don't run shell commands or edit files."
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-code-smell-checker
    config:
      mode: any_order
      required_skills:
        - code-smell-checker
