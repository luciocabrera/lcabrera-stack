id: trigger-maintainability-ranking
name: Ranking maintainability problems across an app
set: regression
tags:
  - positive-trigger
inputs:
  prompt: "apps/showcase has become hard to change. Find the worst maintainability problems in it, like god files, long parameter lists and copy-pasted logic, and rank them by how much they hurt; tell me what you would do first. Load any skill you need, but don't run shell commands or edit files."
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-code-smell-checker
    config:
      mode: any_order
      required_skills:
        - code-smell-checker
