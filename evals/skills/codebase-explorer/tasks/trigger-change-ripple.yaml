id: trigger-change-ripple
name: Working out what a change touches
set: capability
tags:
  - positive-trigger
inputs:
  prompt: "I want to change a helper in packages/utils. Find out what depends on it across the apps and packages, and how far the change would ripple. Tell me what you would do first. Load any skill you need, but don't run shell commands or edit files."
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-codebase-explorer
    config:
      mode: any_order
      required_skills:
        - codebase-explorer
