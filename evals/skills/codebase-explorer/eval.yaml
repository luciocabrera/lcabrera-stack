name: codebase-explorer-trigger
description: Does codebase-explorer load to trace a feature, map integrations, learn an unfamiliar area or work out what a change touches, and stay out of single-file lookups, tool flags and definitions?
skill: codebase-explorer
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 240
  executor: copilot-sdk
  model: claude-sonnet-5.5
  inject_skill_body: false
  skill_directories:
    - ../../../.github/skills
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 1.0
    description: The skill loaded when it should and not when it should not.
tasks:
  - 'tasks/*.yaml'
