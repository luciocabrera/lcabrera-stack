id: trigger-biome-react-rule
name: Enabling a Biome react rule
set: capability
tags:
  - positive-trigger
inputs:
  prompt:
    Read biome.jsonc. The react override does not catch a component defined
    inside another component. How should I change the config so it does? Tell me
    what you would do first. Load any skill you need, but don't run shell
    commands or edit files.
  context:
    fixture: biome
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-lint-toolchain
    config:
      mode: any_order
      required_skills:
        - lint-toolchain
