id: trigger-sonar-unreproducible
name: A Sonar finding I cannot reproduce
set: capability
tags:
  - positive-trigger
inputs:
  prompt: "Read .sonarcloud.properties. SonarCloud flags something on my pull
    request #42 that I can't see anywhere locally. How do I get that PR's
    findings into a file I can read? Tell me what you would do first. Load any
    skill you need, but don't run shell commands or edit files."
  context:
    fixture: sonar
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-lint-toolchain
    config:
      mode: any_order
      required_skills:
        - lint-toolchain
