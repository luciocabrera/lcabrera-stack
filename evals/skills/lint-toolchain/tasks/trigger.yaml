id: trigger
name: Debugging a silent lint rule
tags:
  - positive-trigger
inputs:
  prompt: "A new Oxlint rule I added to the root vite.config.ts reports nothing, even on a file I know violates it. Help me find out why; tell me what you would do first. Load any skill you need, but don't run shell commands or edit files."
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-lint-toolchain
    config:
      mode: any_order
      required_skills:
        - lint-toolchain
