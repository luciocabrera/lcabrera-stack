id: trigger-oxlint-only
name: An oxlint-only report
set: capability
tags:
  - positive-trigger
inputs:
  prompt:
    Produce a repo-wide report of just the oxlint findings, as JSON. Tell me
    what you would do first. Load any skill you need, but don't run shell
    commands or edit files.
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-linter-checker
    config:
      mode: any_order
      required_skills:
        - linter-checker
