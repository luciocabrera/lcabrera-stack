name: linter-checker-trigger
description: Does linter-checker load when asked for a deterministic, repo-wide lint report per engine, and stay out of one rule, one line, or a diff review?
skill: linter-checker
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 240
  executor: copilot-sdk
  model: claude-sonnet-5.5
  inject_skill_body: false
  skill_directories:
    - ../../../.github/skills
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 1.0
    description: The skill loaded when it should and not when it should not.
tasks:
  - 'tasks/*.yaml'
