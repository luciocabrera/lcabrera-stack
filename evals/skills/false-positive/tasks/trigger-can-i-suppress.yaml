id: trigger-can-i-suppress
name: Asking whether a finding can be suppressed
set: capability
tags:
  - positive-trigger
inputs:
  prompt: "Can I just put an eslint-disable-next-line on this react-hooks finding? I'm sure it's a false positive. Tell me what you would do first. Load any skill you need, but don't run shell commands or edit files."
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-false-positive
    config:
      mode: any_order
      required_skills:
        - false-positive
