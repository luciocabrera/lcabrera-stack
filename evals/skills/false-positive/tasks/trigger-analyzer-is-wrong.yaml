id: trigger-analyzer-is-wrong
name: Claiming an analyzer is mistaken
set: capability
tags:
  - positive-trigger
inputs:
  prompt: "Oxlint keeps reporting a finding on code I'm convinced is correct. I think the rule is just wrong about this case and I want it out of the way so the gate passes. Tell me what you would do first. Load any skill you need, but don't run shell commands or edit files."
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-false-positive
    config:
      mode: any_order
      required_skills:
        - false-positive
