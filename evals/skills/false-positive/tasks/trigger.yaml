id: trigger
name: A finding the user says is wrong
set: capability
tags:
  - positive-trigger
inputs:
  prompt: "Biome flags lint/a11y/useSemanticElements on our window splitter in packages/ui, but there is no native element for a focusable separator, so I think Biome is wrong here. What do I do about it? Tell me what you would do first. Load any skill you need, but don't run shell commands or edit files."
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-false-positive
    config:
      mode: any_order
      required_skills:
        - false-positive
