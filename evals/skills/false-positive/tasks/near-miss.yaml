id: near-miss
name: Fixing a nested ternary
set: capability
tags:
  - negative-trigger
inputs:
  prompt: "Rewrite this line so it uses no nested ternary, and show only the result: const size = big ? 'l' : medium ? 'm' : 's'; Load any skill you need, but don't run shell commands or edit files."
expected:
  should_trigger: false
graders:
