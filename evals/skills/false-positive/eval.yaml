name: false-positive-trigger
description: Does false-positive load when someone believes an analyzer finding is wrong or asks to suppress one, and stay out of ordinary lint fixes, rule definitions and linter configuration?
skill: false-positive
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 240
  executor: copilot-sdk
  model: claude-sonnet-5.5
  inject_skill_body: false
  skill_directories:
    - ../../../.github/skills
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 1.0
    description: The skill loaded when it should and not when it should not.
tasks:
  - 'tasks/*.yaml'
