name: quality-gate-workflow-trigger
description: Does quality-gate-workflow load when a change needs validating before it is done, opened or merged, and stay out of single-tool, test-matcher and CI-syntax questions?
skill: quality-gate-workflow
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 240
  executor: copilot-sdk
  model: claude-sonnet-5.5
  inject_skill_body: false
  skill_directories:
    - ../../../.github/skills
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 1.0
    description: The skill loaded when it should and not when it should not.
tasks:
  - 'tasks/*.yaml'
