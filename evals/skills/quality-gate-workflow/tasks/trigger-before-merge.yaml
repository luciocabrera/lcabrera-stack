id: trigger-before-merge
name: Checking a branch before merge
set: capability
tags:
  - positive-trigger
inputs:
  prompt: My branch is about to be merged. Make sure it passes formatting, lint,
    types and tests the way CI will. Tell me what you would do first. Load
    any skill you need, but don't run shell commands or edit files.
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-quality-gate-workflow
    config:
      mode: any_order
      required_skills:
        - quality-gate-workflow
