id: trigger-saving-state
name: 'Showing a saving state from the navigation'
set: capability
tags:
  - positive-trigger
inputs:
  prompt: 'Read app/routes/orders.tsx. While the add-order form is submitting, show "Saving..." and disable the button, using the router''s own idea of what is in flight. Tell me what you would do first. Load any skill you need, but don''t run shell commands or edit files.'
  context:
    fixture: route
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-react-router-framework-mode
    config:
      mode: any_order
      required_skills:
        - react-router-framework-mode
