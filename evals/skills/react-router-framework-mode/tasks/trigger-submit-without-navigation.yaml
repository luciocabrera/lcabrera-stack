id: trigger-submit-without-navigation
name: 'Submitting without leaving the page'
set: capability
tags:
  - positive-trigger
inputs:
  prompt: "Read app/routes/orders.tsx. The add-order form should submit in the background and leave the user on the page, with the list refreshing afterwards. Tell me what you would do first. Load any skill you need, but don't run shell commands or edit files."
  context:
    fixture: route
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-react-router-framework-mode
    config:
      mode: any_order
      required_skills:
        - react-router-framework-mode
