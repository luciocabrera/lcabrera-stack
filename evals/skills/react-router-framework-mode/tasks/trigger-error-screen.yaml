id: trigger-error-screen
name: 'Giving a route its own error screen'
set: capability
tags:
  - positive-trigger
inputs:
  prompt: "Read app/routes/orders.tsx. When loading the orders fails, the whole page goes blank. Give this route its own error screen instead. Tell me what you would do first. Load any skill you need, but don't run shell commands or edit files."
  context:
    fixture: route
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-react-router-framework-mode
    config:
      mode: any_order
      required_skills:
        - react-router-framework-mode
