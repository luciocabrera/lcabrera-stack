name: react-19-trigger
description: Does react-19 load for form actions, pending and optimistic UI, ref props and memoization under the compiler, and stay out of reading a component's text, imports or file type?
skill: react-19
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 240
  executor: copilot-sdk
  model: claude-sonnet-5.5
  inject_skill_body: false
  skill_directories:
    - ../../../.github/skills
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 1.0
    description: The skill loaded when it should and not when it should not.
tasks:
  - 'tasks/*.yaml'
