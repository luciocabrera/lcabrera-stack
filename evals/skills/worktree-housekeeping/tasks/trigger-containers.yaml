id: trigger-containers
name: Removing leftover test containers with the worktrees
set: capability
tags:
  - positive-trigger
inputs:
  prompt: "My disk is full of stale agent worktrees and stopped postgres test containers from old runs. Prune both safely. Load any skill you need, but don't run shell commands or edit files."
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-worktree-housekeeping
    config:
      mode: any_order
      required_skills:
        - worktree-housekeeping
