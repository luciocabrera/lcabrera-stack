id: trigger-session-hint
name: Acting on the session-start count
set: capability
tags:
  - positive-trigger
inputs:
  prompt: "When this session started it printed that 14 git worktrees look removable. Deal with that: what goes, and what do you need from me? Load any skill you need, but don't run shell commands or edit files."
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-worktree-housekeeping
    config:
      mode: any_order
      required_skills:
        - worktree-housekeeping
