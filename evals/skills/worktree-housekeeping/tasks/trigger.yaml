id: trigger
name: Clearing out a pile of worktrees
set: capability
tags:
  - positive-trigger
inputs:
  prompt: "git worktree list shows about forty checkouts next to this repo, most from pull requests that already merged. Clean them up for me, but tell me first what you would remove. Load any skill you need, but don't run shell commands or edit files."
expected:
  should_trigger: true
graders:
  - type: skill_invocation
    name: loads-worktree-housekeeping
    config:
      mode: any_order
      required_skills:
        - worktree-housekeeping
