name: worktree-housekeeping-trigger
description: Does worktree-housekeeping load to find and remove stale or merged git worktrees and throwaway test containers, and stay out of single git commands, creating a worktree and branch questions?
skill: worktree-housekeeping
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 240
  executor: copilot-sdk
  model: claude-sonnet-5.5
  inject_skill_body: false
  skill_directories:
    - ../../../.github/skills
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 1.0
    description: The skill loaded when it should and not when it should not.
tasks:
  - 'tasks/*.yaml'
