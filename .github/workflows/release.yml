name: Release

# Publishes any public package whose version is not yet on npm, and opens a
# GitHub Release for it. Versioning is deliberately NOT done here.
#
# Why the split: Changesets' usual flow has a bot open the "Version Packages"
# PR. That PR can never merge in this repo — a pull request opened with
# GITHUB_TOKEN does not trigger `pull_request` workflows, so its required checks
# never run. `update-changelog.yml` hit the same `main` ruleset and reported
# success through 159 commits without ever landing a change (AGENTS.md §
# Changelog & Labels). Making it work needs a GitHub App token, which is not
# worth it for a step that is one command. So a human runs
# `vp run release:version` and opens an ordinary PR; only publishing is
# automated, and publishing is the half that never fights the ruleset because
# tags and releases are not branch-protected.
#
# `changeset publish` is a no-op when every version is already on the registry,
# so running it on every push to `main` is safe and needs no path filter. While
# a package is `private: true` it is skipped entirely — which is what keeps this
# workflow inert until the deliberate decision to publish is made.
#
# This deliberately does NOT use `changesets/action`. The action has no
# "publish only" mode: given a pending changeset it versions and opens a PR
# instead of publishing, which is the manual step above — and it cannot even get
# that far, because `vp config` installs .vite-hooks and its `Version Packages`
# commit is rejected by the Conventional-Commit commit-msg hook. Guarding it
# with a repo-wide "is any changeset pending?" count was the previous answer,
# and it was worse than the problem: several agents merge into this repo, so the
# count is essentially never zero, and the job reported success through every
# push while publishing nothing (#620). Calling the CLI directly removes the
# reason the gate existed. The `Plan the release` step below now asks the
# registry, per package, which is the same question `changeset publish` asks
# itself — the gate only avoids a pointless build, and the CLI stays the
# authority on what ships.
#
# The action's one irreplaceable contribution was the GitHub Release body, so
# that is rebuilt from the same `CHANGELOG.md` by `scripts/release-notes.mjs`.
# It made one more contribution that was invisible until it was gone: it
# configured a git identity, without which `changeset publish` cannot create the
# annotated tags it reports creating. That is the `Configure the tagging
# identity` step below, and it is load-bearing (#745).
#
# Authentication is npm trusted publishing (OIDC): no NPM_TOKEN, and npm attaches
# a provenance attestation on its own, so `--provenance` must NOT be passed.
# It requires npm >= 11.5.1 and `id-token: write` below.
#
# FIRST PUBLISH IS MANUAL, and this workflow cannot do it. npm configures a
# trusted publisher per package, which requires the package to already exist, so
# a brand-new scoped package has nothing to attach the trust to (npm/cli#8976 —
# scoped first publishes fail with E404 under OIDC). Publish each package once
# by hand, configure its trusted publisher on npmjs.com, and every release after
# that is automatic.

on:
  push:
    branches: [main]

permissions:
  contents: write # git tags + GitHub Releases
  id-token: write # OIDC token for npm trusted publishing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish changed packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # This is `@lcabrera/repo-standards`' `repo-plan-release`, run by path rather
      # than by name: it goes before the toolchain is installed — plain node and
      # npm, no deps — because when there is nothing to publish every step below
      # is wasted work, and the bin shim does not exist until `vp install` has
      # run. Grep for the path, not the command name. It writes the per-package
      # plan to the run summary, so "published nothing" is visible on the run
      # page rather than buried in a log.
      #
      # Permissive by design: anything it cannot resolve counts as publishable,
      # so the job proceeds and `changeset publish` decides. Over-reporting
      # costs a build; under-reporting would silently skip a release.
      - name: Plan the release
        id: plan
        run: node packages/repo-standards/scripts/release-publish-plan.mjs --github

      - name: Setup Vite+
        if: steps.plan.outputs.count != '0'
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          cache: false

      - name: Install dependencies
        if: steps.plan.outputs.count != '0'
        run: vp install --frozen-lockfile --ignore-scripts && vp config

      - name: Build the publishable packages
        if: steps.plan.outputs.count != '0'
        # Consumers install `dist`, and `publishConfig.exports` points there, so
        # publishing without building would ship a tarball whose every export
        # target is missing. publish:verify packs each package and reads the
        # tarball back, so it fails on exactly that.
        #
        # It also asserts that THIS workflow still publishes through pnpm, and
        # that is not decoration: substituting `publishConfig.exports` is a pnpm
        # extension. An `npm publish` here would upload tarballs whose `exports`
        # still point at ./src, which no consumer can load
        # (ERR_UNSUPPORTED_NODE_MODULES_TYPE_STRIPPING), and an npm version is
        # permanent. Changing the publish command below means revisiting
        # docs/decisions/ADR-073-publishing-gates-check-the-packed-tarball.md
        # first; the gate will stop you either way.
        run: vp run packages:build && vp run publish:verify

      - name: Provide pnpm for the publish step
        if: steps.plan.outputs.count != '0'
        # `changeset publish` picks its publish tool by DETECTING the lockfile,
        # then shells out to `pnpm publish`. There is no option to force npm, and
        # its `pnpm --version` probe failing is caught and ignored — so it commits
        # to pnpm whether or not pnpm exists. vp drives pnpm through its own
        # runtime and a fresh runner has no `pnpm` on PATH, so the first real run
        # of this job died with `spawn pnpm ENOENT`, after it had already decided
        # what to publish.
        #
        # corepack activates exactly the version pinned in the root package.json
        # `packageManager` field, integrity hash included, so this is the same
        # pnpm vp uses and not a second one drifting alongside it.
        #
        # The assertion matters: without it the next failure is another ENOENT
        # from deep inside the publish, long after the useful context is gone.
        run: |
          corepack enable pnpm
          actual="$(pnpm --version)"
          expected="$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")"
          echo "pnpm $actual (pinned $expected)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::pnpm $actual does not match the pinned $expected"
            exit 1
          fi

      # NOT decoration, and not "git housekeeping": `@changesets/git` tags with
      # `git tag <name> -m <name>`, and the `-m` makes it an ANNOTATED tag so
      # that `git push --follow-tags` carries it. An annotated tag needs a
      # committer identity, `actions/checkout` does not set one, and without it
      # every tag call exits 128. `changesets/action` used to configure this;
      # #622 replaced the action with the CLI and the identity went with it, so
      # eight versions reached npm untagged before anyone noticed (#745).
      # Deleting these two lines silently restores that.
      - name: Configure the tagging identity
        if: steps.plan.outputs.count != '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # `changeset publish` creates the `<name>@<version>` tags locally but does
      # not push them, which is what the action used to do. Diffing the tag list
      # around the call is how we learn what actually shipped: its exit status
      # says nothing about which packages it chose, and a package already on the
      # registry is skipped silently.
      - name: Publish to npm
        id: publish
        if: steps.plan.outputs.count != '0'
        run: |
          # `pipefail` because the publish is piped into `tee`: without it the
          # step's status is tee's, so a failed publish would report success.
          set -o pipefail
          # Piped through `sort` explicitly: `comm` silently produces nonsense
          # on unsorted input, and `git tag` honours a `tag.sort` config that
          # this workflow does not control.
          # `pnpm exec`, never `npx`: npx installs on demand and runs the
          # fetched package's lifecycle scripts, which is not something to do in
          # the one job holding an OIDC token with publish rights. `pnpm exec`
          # runs the binary already in node_modules, at the lockfile's version.
          git tag | sort > /tmp/tags-before
          pnpm exec changeset publish 2>&1 | tee /tmp/publish.log
          git tag | sort > /tmp/tags-after
          comm -13 /tmp/tags-before /tmp/tags-after > /tmp/tags-new

          # `changeset publish` logs `New tag: <name>` BEFORE calling git and
          # discards the result, so its log names tags git may never have made.
          # Its count and the refs that actually exist are therefore independent
          # signals, and comparing them is the only thing that tells a real
          # tagging failure apart from a publish that legitimately shipped
          # nothing — both leave the diff empty.
          reported="$(grep -c 'New tag:' /tmp/publish.log || true)"
          created="$(grep -c . /tmp/tags-new || true)"
          echo "Newly published tags: $created (changeset reported $reported)"
          cat /tmp/tags-new
          if [ "$reported" -ne "$created" ]; then
            echo "::error::changeset publish reported $reported tag(s) but $created exist. The packages are already on npm and CANNOT be republished — re-running will not fix this. Create the missing tags and Releases by hand, then fix the tagging step."
            exit 1
          fi

      # Split from the publish on purpose. npm is already written to by this
      # point and cannot be undone, so a failure here must be recoverable by
      # re-running rather than by re-publishing. Tags are pushed before the
      # releases so a partial failure still leaves the refs behind.
      - name: Push tags and open GitHub Releases
        if: steps.plan.outputs.count != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -s /tmp/tags-new ] || { echo "No new tags — nothing published."; exit 0; }
          git push origin --tags
          while read -r tag; do
            [ -n "$tag" ] || continue
            node scripts/release-notes.mjs "$tag" > /tmp/notes.md
            gh release create "$tag" --title "$tag" --notes-file /tmp/notes.md
          done < /tmp/tags-new
