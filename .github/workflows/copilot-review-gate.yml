name: Copilot Review Gate

# Publishes the `Copilot review complete` commit status, which is green only
# while an ACCEPTED REVIEWER's own newest review names the pull request's current
# head commit. Two reviewers are accepted; the block below says which, and why the
# comparison is per reviewer.
#
# Why a workflow at all, when ruleset `19141543` already carries
# `copilot_code_review` with `review_on_push: true`: that setting REQUESTS a
# re-review on each push, it does not report whether one arrived. On #671 a
# review of `ff868c68` stood through two further pushes and a human had to
# re-request it — a completed review of superseded code is indistinguishable, in
# the UI, from a review of the head. This job makes that window visible while it
# is open, and permanent when the re-review never comes.
#
# Event-driven, and never a job that sleeps. Waiting inside a run for a review to
# arrive burns Actions minutes for the length of the wait and still races the
# push that supersedes it; recomputing when the head or the reviews change is
# both cheaper and correct.
#
# That objection is to holding a run open, not to a second way of being told to
# recompute — and a second way turned out to be necessary. `pull_request_review`
# is not delivered reliably here: a review submitted by Copilot usually creates
# no workflow run at all, so the status keeps reporting the previous commit, and
# a status nobody recomputed reads exactly like one that is honestly still
# waiting. #737 carries the measurement and the two commands that reproduce it.
#
# So `review-gate-reconcile.yml` sweeps the open pull requests on a schedule and
# re-runs the script below for each. It is a reconcile loop, not a wait loop, and
# the difference is not a matter of taste: it holds nothing open, its cost is
# bounded by the number of open pull requests rather than by how long a review
# takes, and it cannot race, because it carries no SHA across an I/O boundary —
# each pull request is handed to this same script, which reads the head and the
# reviews together and posts against the head it read. That file's header carries
# the interval and why it is what it is.
#
# `workflow_dispatch` is the same recompute for one named pull request, so an
# author looking at a stale status has something to press instead of having to
# find and re-run an earlier workflow run.
#
# It is NOT yet a required context — promotion to the ruleset is #698,
# deliberately separate, because a required check that has never reported blocks
# every pull request including the one that would fix it.
#
# WHICH REVIEWERS, AND WHY PER REVIEWER. The set is an explicit named list in
# scripts/lib/copilot-review.mjs — today the Copilot bot above, and the in-workflow
# reviewer in claude-review.yml. Per reviewer rather than newest-across-the-set, so
# that a slower reviewer arriving late with a review of an earlier commit cannot
# un-green a head another accepted reviewer has already covered. Nothing else about this file changes: the status
# still means "a reviewer ran against this head" and still never means "approved",
# and this workflow is still the only writer of the context. Which reviewer
# satisfied it is carried in the status description, so a monoculture is visible
# rather than silent. The list, why it is OR rather than AND, and the known hole
# in the second entry are in that module and in the doc below.
#
# The decision logic is scripts/lib/copilot-review.mjs (pure, unit-tested); the
# behaviour, the never-reviewed case and the break-glass path are documented in
# docs/tooling/copilot-review-gate.md.

on:
  # `synchronize` is the one that matters: it fires on every push and the new
  # head has no review yet, so the status goes pending within this run.
  # `converted_to_draft` is here so a PR pulled back to draft still reports.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]
  # Break-glass, and the one rung an author can reach without push access to a
  # status API. A dispatch run is attributed to whoever pressed it, so a
  # maintainer's dispatch executes where the same recompute triggered by a bot's
  # review does not.
  workflow_dispatch:
    inputs:
      pr:
        description: The pull request number to recompute
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

# No `concurrency` group on purpose. Cancelling a superseded run would leave the
# event it was handling with no status at all, and the runs cannot disagree: each
# one re-reads the head and the reviews together and posts against the head it
# read, so a slow run publishes the same verdict as the fast one that overtook it.

jobs:
  publish-copilot-review-status:
    # This name must NOT be `Copilot review complete`. A job's check run and a
    # commit status share one namespace on the PR, and ruleset contexts match by
    # name — so a job named after the status would put a second, always-green
    # check under that name, and the gate #698 promotes could be satisfied by
    # "the workflow ran" instead of "Copilot reviewed the head".
    name: Publish the Copilot review status
    runs-on: ubuntu-latest
    steps:
      # Default ref on purpose, which differs per event and is right every time:
      # for BOTH `pull_request` and `pull_request_review` it is that pull
      # request's merge ref, so the YAML and the script it runs come from one
      # commit (the skew that broke #177); for `workflow_dispatch` it is the ref
      # the dispatch named. Each of those checks out the script that matches the
      # YAML that ran. Nothing here reads the working tree beyond that script —
      # the head SHA comes from the API, not from git.
      #
      # The `pull_request_review` half is measured, not assumed, and it is worth
      # stating precisely because two wrong readings are available. It said "the
      # ref it was dispatched on (the default branch, normally)" until #732; what
      # rules the default branch out is that four such runs were created from
      # ci/695-copilot-review-complete-check on 2026-08-14, three of them
      # executing, while this file was not on `main` at all — it landed there in
      # 4660e05f the next morning. It is not the branch TIP either: run
      # 32022891578 (`pull_request_review` on #740) checked out
      # refs/remotes/pull/740/merge. Do not infer the ref for another event from
      # a general rule; read a run's checkout step.
      - name: Check out the ref this event runs from
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A fork PR gets a read-only GITHUB_TOKEN, so no status can be posted from
      # one and the check is absent rather than red. That is fail-closed and
      # intended — the break-glass path in docs/tooling/copilot-review-gate.md
      # covers it — but it must be understood rather than discovered, so the run
      # says so out loud and still prints the verdict it would have published.
      - name: Publish the status against the current head
        env:
          GH_TOKEN: ${{ github.token }}
          # Present on both review events' payloads, and given by hand on a
          # dispatch. Passed through env, never a shell interpolation, so nothing
          # from a PR is executed.
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          # The emptiness test is what keeps a dispatch out of the fork branch:
          # `workflow_dispatch` carries no `pull_request` object, and comparing
          # an absent name against the repository would call every dispatch a
          # fork and silently turn break-glass into a dry run.
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != '' &&
            github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$IS_FORK" = "true" ]; then
            echo "::warning::Fork pull request — GITHUB_TOKEN is read-only here, so no commit status can be published. The check stays absent; see docs/tooling/copilot-review-gate.md for the break-glass path."
            node scripts/copilot-review-status.mjs --pr "$PR_NUMBER" --dry-run
          else
            node scripts/copilot-review-status.mjs --pr "$PR_NUMBER"
          fi
