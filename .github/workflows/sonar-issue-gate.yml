name: Sonar Issue Gate

# Strict, free-plan-friendly Sonar enforcement. SonarCloud's own required check
# runs the "Sonar way" quality gate, which is rating-based and lets new *code
# smells* through (assigning a stricter custom gate is a paid feature). This job
# closes that gap: it fails the PR on ANY open Sonar issue, using the repo's
# sonar-report.mjs. `--wait` polls the Compute Engine until THIS commit's
# analysis has finished (Automatic Analysis runs async, in parallel with CI), so
# it never races; on timeout it skips rather than blocks. Fork PRs get no
# secrets, so the script skips there and the job stays green — but on a
# same-repo PR a missing token now FAILS (--require-token) instead of reporting
# this required check green without having run.

on:
  pull_request:

permissions:
  contents: read

jobs:
  sonar-issue-gate:
    name: Strict Sonar issue gate
    runs-on: ubuntu-latest
    steps:
      # Checks out the MERGE ref (actions/checkout's default for pull_request),
      # not the PR head, and that is load-bearing. GitHub runs the workflow file
      # from the merge result but a `ref:` checkout brings the PR head's copy of
      # the repo — so a change that teaches a script a new flag lands in the YAML
      # immediately while every open PR still carries the old script, and the run
      # dies on an unknown argument. That is exactly how #175 broke #177: the
      # step passed --require-token to a sonar-report.mjs that predated it.
      #
      # This job needs nothing from the head except its commit timestamp, which
      # comes from the event payload below, so the merge ref costs it nothing.
      # fetch-depth 2 reaches the merge commit's second parent — the PR head —
      # so that timestamp is resolvable.
      - name: Check out the PR merge ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 2

      - name: Wait for SonarCloud analysis, then fail on any new issue
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # sonar-report.mjs needs only Node built-ins + global fetch (present on
        # ubuntu-latest), so no workspace install. --since = the PR head commit
        # time, the freshness guard so a previous commit's analysis isn't accepted.
        # HEAD_SHA comes through env, never a shell interpolation. If it cannot be
        # resolved the step fails rather than dating the guard from the merge
        # commit, which would be newer than the analysis and reject every run.
        run: |
          SINCE="$(git show -s --format=%cI "$HEAD_SHA")"
          echo "PR #${{ github.event.pull_request.number }} head committed at $SINCE"
          # --require-token on same-repo PRs only: there the secret IS available,
          # so a missing one is a misconfiguration and must fail rather than
          # report this required check green without ever running. Fork PRs get
          # no secrets by design, so they omit it and still skip cleanly.
          REQUIRE_TOKEN=""
          if [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            REQUIRE_TOKEN="--require-token"
          fi
          node scripts/sonar-report.mjs --gate --fail-on-issues $REQUIRE_TOKEN \
            --pr "${{ github.event.pull_request.number }}" --wait --since "$SINCE"
