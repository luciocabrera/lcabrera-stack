name: Check Safe

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  quality-gate:
    name: Quality Gate (Format · Lint · Types)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # typecheck:changed diffs the PR head against its base ref, so it needs
          # the full history and the base branch.
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@8ecb39174989ce55af90f45cf55b02738599831d
        with:
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile --ignore-scripts && vp config

      - name: Generate route types
        id: preflight
        run: vp run typegen:all

      - name: Format · Lint · Type-check
        id: quality_gate
        run: vp check

      - name: TypeScript project type-check (tsc)
        id: typecheck_gate
        # `vp check`'s type pass is tsgolint driving each workspace's
        # tsconfig — close to tsc, but not tsc, and it knows nothing about
        # the per-workspace `typecheck` scripts. Those scripts carry work
        # tsgolint does not do: packages/ui gates its public API against
        # server-only node:* imports (check:public-api), and the React Router
        # apps regenerate route types before checking. Running the real
        # compiler here is the reference implementation the other passes are
        # approximations of.
        #
        # On a PR, `typecheck:changed` runs tsc only for the changed workspaces
        # plus their dependents — a type error a diff introduces surfaces where
        # the type is used, which the dependents walk covers, and `vp check`'s
        # tsgolint pass above still type-checks the whole tree as a net. A
        # root/shared change or a push to `main` runs the full `typecheck:all`.
        env:
          TEST_CHANGED_BASE: origin/${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            vp run typecheck:changed
          else
            vp run typecheck:all
          fi

      - name: Type-check selection summary
        # Make the change-based selection visible in the run, not buried in the
        # type-check log — the per-workspace running/skipped breakdown goes to
        # the job summary. Report-only; type-checks nothing.
        if: github.event_name == 'pull_request' && always()
        env:
          TEST_CHANGED_BASE: origin/${{ github.base_ref }}
        run: |
          bash scripts/changed-files.sh \
            node scripts/run-changed.mjs typecheck --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: ESLint custom-rules pass
        id: eslint_gate
        # `vp check` is fmt + Oxlint + the tsgolint type pass only — it does not
        # know about the per-workspace eslint pass, so eslint-only findings
        # (perfectionist import/module ordering, the react/stylex rule sets,
        # local-rules) would otherwise never fail a PR. Inherited debt stays
        # baselined in each workspace's eslint-suppressions.json; this gates new
        # violations.
        run: vp run -r lint:eslint:check

      - name: Biome lint pass
        id: biome_gate
        # Third linter, and the only one that covers the React-domain rules the
        # other two miss (noNestedComponentDefinitions, noDuplicatedSpreadProps).
        # Config: biome.jsonc at the root — ONE repo-wide pass like Oxlint, not a
        # per-workspace fan-out, because `overrides` already scopes the react
        # domain to the three React workspaces. Biome's formatter and assist are
        # off there: Oxfmt owns formatting and perfectionist owns import order,
        # and letting Biome touch either restarts the formatter/linter fight.
        #
        # This mirrors the local pre-commit hook (`staged` block in the root
        # vite.config.ts) — the hook only sees staged files, so this is what
        # catches a violation that arrives via an unhooked push or --no-verify.
        run: vp run lint:biome:check

      - name: React Doctor gate
        id: react_doctor_gate
        # A React-specific analyser the other three do not replicate: effect
        # cleanup, server/client boundaries, render-path costs. Run as the
        # standalone CLI rather than through its documented `jsPlugins` bridge
        # into Oxlint — that bridge is the one this repo removed for
        # double-reporting, and the plugin build silently drops the
        # project-level rules. ADR-055.
        #
        # Full scope, failing on error severity only; warnings are advisory and
        # land in the (gitignored) report the same run writes. Two silent-pass
        # modes are guarded in the script rather than trusted: the CLI exits 0
        # with a setup nag when no `doctor` package script exists, and it
        # discards a malformed config and scans with defaults while still
        # reporting success.
        run: vp run react-doctor:verify

      - name: COMMANDS.md is still true
        id: commands_gate
        # Every other claim this repo makes has a machine behind it — types,
        # lint, format, dead code, tests. Documentation was the one class that
        # failed nothing, and it rotted accordingly: seven undocumented root
        # scripts, a README telling people to run `vp run seed` from the root
        # (not a root script), an "all 15 workspaces" count that was 16, and a
        # claudelint apparatus documented as working while the binary did not
        # exist on npm at all.
        #
        # Ground truth is `vp run`'s own task list, so this sees tasks from all
        # three sources (package.json scripts, vite.config.ts run.tasks, shared
        # @lcabrera/vite-config factories) instead of re-implementing resolution.
        run: vp run commands:verify

      - name: Coordination register is consistent
        id: coordination_gate
        # The in-git "who is working on what" register under docs/coordination/.
        # Multiple agents + humans work this repo in parallel; the only prior
        # signals were `git branch -vv` and per-agent scratch in ~/.claude/plans/
        # (opaque names, invisible to everyone else) — which is how one agent
        # nearly edited code another already owned. This fails only on register
        # INTEGRITY the PR author controls (malformed task file, BOARD.md drift);
        # coordination signals (area overlap, staleness, missing branch) are
        # emitted as ::warning:: annotations so they surface without blocking an
        # unrelated PR. See docs/coordination/README.md.
        run: vp run coordination:verify

      - name: Tooling scripts within size ceiling
        id: scripts_gate
        # `.mjs`/`.cjs` build/tooling scripts have no rule coverage otherwise:
        # `.claude/rules/` targets TS/TSX, the eslint fan-out is per-workspace so
        # it never reaches root `scripts/`, and fallow's maxUnitSize is
        # per-FUNCTION — a 650-line file of small functions passes it. This caps
        # code lines per file (inherited offenders grandfathered in
        # scripts/script-size-baseline.json, which may not grow). See
        # .claude/rules/scripts.md.
        run: vp run scripts:verify

      - name: Oxlint plugin families are loaded
        id: lint_plugins_gate
        # Naming `lint.plugins` REPLACES Oxlint's default set, so dropping an
        # entry disables that whole family and reports nothing — the same clean
        # pass as correct code. This lints a deliberate violation per family
        # instead of reading config, and rejects a `lint` block in a workspace
        # config, which Vite+ never loads. See ADR-042.
        run: vp run lint:plugins:verify

      - name: The eslint pass still runs its rules
        id: lint_eslint_gate
        # The step above covers Oxlint only, and exited 0 while the entire eslint
        # pass was dying on a TypeError. eslint exits non-zero both for findings
        # and for a throwing rule, so the exit code cannot tell "checked
        # everything" from "checked nothing". This plants a misordered import and
        # requires the rule to report it. See #472.
        run: vp run lint:eslint:verify

      - name: Public packages carry no unapproved suppression
        id: suppressions_gate
        # AGENTS.md §4 holds ui/api/server/utils to "every finding gets fixed,
        # never baselined or disabled". That was enforced for the eslint
        # baseline alone — gitignored, so CI checks out nothing to suppress
        # WITH — and for none of the other five mechanisms. When they were first
        # counted, packages/ui held 17 inline directives and 6 Biome rules
        # turned off against its own files while the docs said it held none.
        # Most were defensible; nothing distinguished a reviewed exception from
        # one added last Tuesday. See docs/agents/public-package-suppressions.md.
        run: vp run suppressions:verify

      - name: Documented paths resolve
        id: docs_gate
        # The largest unchecked surface in the repo: ~230 markdown files naming
        # paths that nothing verified. A single audit corrected 30 files and
        # deleted 2 documents describing directories that no longer existed —
        # AGENTS.md itself listed 6 app directories that were gone. Only
        # root-anchored paths and relative markdown links are checked, so
        # teaching examples and suffix conventions never fail the build;
        # inherited breakage is grandfathered in scripts/docs-paths-baseline.json.
        run: vp run docs:verify

      - name: No document names a file this PR renamed away
        id: renames_gate
        # docs:verify only resolves ROOT-ANCHORED tokens, so a backticked bare
        # filename is unchecked in every document and a rename invalidates each
        # one silently — #604 renamed a batch of modules and the ADR naming one
        # of them was found by hand afterwards (#611). Widening docs:verify to
        # every bare filename would report mostly suffix conventions and
        # teaching examples, so this is scoped to the names the diff actually
        # renamed away. Pull requests only: a push to main has no base ref to
        # diff against, and the gate refuses to run rather than report a pass it
        # did not earn.
        if: github.event_name == 'pull_request'
        env:
          TEST_CHANGED_BASE: origin/${{ github.base_ref }}
        run: vp run renames:verify

      - name: Route-folder types/constants name a real artifact
        id: route_names_gate
        # The other half of local-rules/domain-folder-filename. That rule
        # classifies a folder from its path alone, which cannot say that
        # routes/car-sales-infinite/ holds a component called CarSales, so it
        # exempts the whole route tree and nothing under one was checked. It
        # cannot close that itself: the eslint pass is not type-aware, and a
        # non-literal fs call is what security/detect-non-literal-fs-filename
        # forbids in a package that publishes as @lcabrera/eslint-plugin and may
        # not suppress a finding. A root script has neither constraint.
        run: vp run route-names:verify

      - name: util exports are named in their package's INVENTORY.md
        id: inventory_gate
        # AGENTS.md makes the three INVENTORY.md files mandatory reading before
        # writing anything new, but nothing failed when an artifact was added
        # without its entry — closing #579 found nineteen such gaps, some a year
        # old. This checks that every *.util.ts/*.util.tsx VALUE export
        # (export const/export function — a type-only export is out of scope)
        # is named (in backticks, not necessarily its own row — packages/server
        # documents private helpers in prose) somewhere in its tree's
        # INVENTORY.md. Pre-existing gaps beyond what #811 already closed are
        # grandfathered in scripts/inventory-drift-baseline.json. See #817.
        run: vp run inventory:verify

      - name: ADR homes, numbering and indexes
        id: adr_gate
        # docs:verify deliberately skips every `decisions` directory — an ADR
        # records a point in time, so its paths may go stale — which left ADR
        # placement as the one structural rule with no gate. Four homes
        # accumulated and ADR-047 came to mean two documents. See
        # docs/decisions/ADR-048-adr-taxonomy-and-one-sequence.md.
        run: vp run adr:verify

      - name: Vite+ managed block stays empty
        id: viteplus_block_gate
        # Vite+ rewrites the region between its markers in AGENTS.md whenever it
        # syncs agent instructions, and `vp install` triggers that — so every
        # fresh worktree gets the upstream template back, whose Review Checklist
        # tells agents to run `vp test`, forbidden by §4. Nothing caught it; the
        # block's comment asked a human to notice. Repair: `vp run
        # viteplus:verify -- --write`.
        run: vp run viteplus:verify

      - name: No config file that no engine reads
        id: stray_configs_gate
        # Formatting and linting are configured once, in the root vite.config.ts
        # (ADR-042). Eight decoy configs had accumulated beside it — the root
        # `.oxfmtrc.json` declared `sortPackageJson: false` where the live config
        # declares `true`, so the file a reader would open to learn the policy
        # stated the opposite, and editing it changed nothing.
        run: vp run configs:verify

      - name: No unaddressed dependency advisory
        id: deps_audit_gate
        # The repo gated its docs, its ADR numbering and four linters, but not
        # its supply chain: a ReDoS advisory against a pinned `hono` was found
        # only because someone went looking, and nothing declared blocked the
        # fix (#516). The gate refuses a report that walked no dependencies, so
        # an unreachable registry fails here instead of reporting a clean tree.
        run: vp run deps:audit

      - name: Published package surface resolves
        id: publish_gate
        # Builds first on purpose. `exports` points at `src` so this repo never
        # needs a build, while consumers install `dist` via publishConfig.exports
        # — a map nothing here exercises. The gate packs each package with pnpm
        # and reads the tarball a consumer would install, so with no build there
        # is no artifact and it fails, rather than reporting the structural half
        # as a pass the way it used to (ADR-073). The build is what gives it
        # something real to check.
        run: vp run packages:build && vp run publish:verify

      - name: Public package API surface is unbroken
        id: api_surface_gate
        # The harness compiles every in-repo consumer, but the real consumers of
        # the four @lcabrera/* packages live outside this tree, where nothing here
        # compiles against them. A removed export, a changed signature or a
        # reshaped union in the PUBLISHED contract passes every other gate
        # (publish:verify checks subpath parity, never the type surface). This
        # diffs each package's exported surface against its tracked snapshot and,
        # against the base ref, requires a changeset for a breaking change. Runs
        # after packages:build — it snapshots the built dist a consumer installs.
        # See docs/decisions/ADR-046 and issue #359.
        env:
          API_SURFACE_BASE: origin/${{ github.base_ref }}
        run: vp run api-surface:verify

      - name: Published types resolve (attw)
        id: attw_gate
        # Complements the surface snapshot: it answers "does the shipped surface
        # even resolve?" for the built public packages, catching the ESM/CJS and
        # module-resolution traps ADR-038 documents. Needs the built dist, and
        # fails without it — it used to report that types resolved for packages
        # it had skipped (ADR-073).
        run: vp run attw:verify

      - name: Write quality summary
        if: always()
        run: |
          if [[ "${{ steps.quality_gate.outcome }}" == "success" ]]; then
            CHECK_STATUS="✅ Passed"
          else
            CHECK_STATUS="❌ Failed"
          fi

          if [[ "${{ steps.eslint_gate.outcome }}" == "success" ]]; then
            ESLINT_STATUS="✅ Passed"
          else
            ESLINT_STATUS="❌ Failed"
          fi

          if [[ "${{ steps.biome_gate.outcome }}" == "success" ]]; then
            BIOME_STATUS="✅ Passed"
          else
            BIOME_STATUS="❌ Failed"
          fi

          if [[ "${{ steps.typecheck_gate.outcome }}" == "success" ]]; then
            TYPECHECK_STATUS="✅ Passed"
          else
            TYPECHECK_STATUS="❌ Failed"
          fi

          if [[ "${{ steps.commands_gate.outcome }}" == "success" ]]; then
            COMMANDS_STATUS="✅ Passed"
          else
            COMMANDS_STATUS="❌ Failed"
          fi

          if [[ "${{ steps.react_doctor_gate.outcome }}" == "success" ]]; then
            REACT_DOCTOR_STATUS="✅ Passed"
          else
            REACT_DOCTOR_STATUS="❌ Failed"
          fi

          if [[ "${{ steps.preflight.outcome }}" == "success" ]]; then
            PREFLIGHT_STATUS="✅ Passed"
          else
            PREFLIGHT_STATUS="❌ Failed"
          fi

          echo "## 🔍 Quality Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Typegen + ESLint Rules Build | $PREFLIGHT_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Format | $CHECK_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint (Oxlint) | $CHECK_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint (ESLint custom rules) | $ESLINT_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint (Biome · react domain) | $BIOME_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| React Doctor (errors block) | $REACT_DOCTOR_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| TypeScript (tsgolint via vp check) | $CHECK_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| TypeScript (tsc · every workspace) | $TYPECHECK_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| COMMANDS.md accuracy | $COMMANDS_STATUS |" >> "$GITHUB_STEP_SUMMARY"

  fallow-audit:
    name: Fallow Audit (new-only gate)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # fallow audit diffs against the PR base ref, so it needs history
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@8ecb39174989ce55af90f45cf55b02738599831d
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile --ignore-scripts && vp config

      - name: Generate route types
        run: vp run typegen:all

      - name: Coverage for the DB-free suites (changed only)
        # Feeds `fallow audit --coverage` real numbers. Without them fallow
        # ESTIMATES coverage from whether a colocated test file exists (none →
        # 0%), and since CRAP is cyclomatic² × (1 − coverage)³ + cyclomatic
        # against a threshold of 30, every function with cyclomatic >= 5 would
        # fail the gate on complexity it does not have.
        #
        # `--changed` scopes it to the covered workspaces this diff actually
        # touched: the audit is new-only (it scores only the diff's own files),
        # so an untouched workspace's coverage is never consulted — running it
        # was pure waste. If the diff touches no covered workspace it writes an
        # empty (valid) coverage file and fallow falls back to estimation.
        #
        # DB-free suites ONLY — this job has no Postgres. Every suite here is
        # DB-free today (the DB-bound ones left with CQMS, #683), but the
        # constraint stands: it is what broke the previous attempt at this
        # (reverted 2026-07-14). See scripts/merge-coverage.mjs.
        env:
          TEST_CHANGED_BASE: origin/${{ github.base_ref }}
        run: |
          bash scripts/changed-files.sh node scripts/merge-coverage.mjs --changed

      - name: Fallow audit vs base branch
        id: fallow_audit
        # Gate mode, severity mapping, and baselines come from .fallowrc.json
        # (audit.gate: new-only) — only newly-introduced dead code, complexity,
        # or duplication fails this step (exit 1). Exit 2 = runtime/config error.
        run: |
          set -o pipefail
          STATUS=0
          vp run fallow:audit --base "origin/${{ github.base_ref }}" --coverage reports/fallow/coverage/coverage-final.json --format json --quiet | tee fallow-audit.raw.txt || STATUS=$?
          # vp run echoes a command banner before the JSON — keep everything
          # from the first JSON line onward so the summary step can parse it,
          # then propagate fallow's exit code (1 = introduced issues, 2 = error).
          awk 'found || /^[{[]/ {found=1; print}' fallow-audit.raw.txt > fallow-audit.json
          exit $STATUS

      - name: Write fallow summary
        if: always()
        run: |
          {
            echo "## 🌾 Fallow Audit"
            echo ""
            if [[ -s fallow-audit.json ]] && jq -e . fallow-audit.json > /dev/null 2>&1; then
              VERDICT=$(jq -r '.verdict // "unknown"' fallow-audit.json)
              case "$VERDICT" in
                pass) BADGE="✅" ;;
                warn) BADGE="⚠️" ;;
                *)    BADGE="❌" ;;
              esac
              echo "| Field | Value |"
              echo "|-------|-------|"
              echo "| Verdict | $BADGE $VERDICT |"
              echo "| Base | \`origin/${{ github.base_ref }}\` |"
              echo "| Dead code introduced | $(jq -r '.attribution.dead_code_introduced // "n/a"' fallow-audit.json) |"
              echo "| Complexity introduced | $(jq -r '.attribution.complexity_introduced // "n/a"' fallow-audit.json) |"
              echo "| Duplication introduced | $(jq -r '.attribution.duplication_introduced // "n/a"' fallow-audit.json) |"
              echo "| Coverage source | $(jq -r '.complexity.summary.coverage_source_consistency // "n/a"' fallow-audit.json) |"
              echo ""
              echo "> Gate \`new-only\`: only newly-introduced issues fail this job. Inherited findings are covered by \`reports/fallow/baselines/\`."
              echo "> Coverage source \`mixed\` is expected: real Istanbul coverage is fed for the DB-free suites, and files with no tests at all still fall back to fallow's static estimate (which guesses 0% and inflates their CRAP)."
            else
              echo "❌ Audit did not produce JSON output — check the job log (exit 2 usually means an invalid base ref or config error)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # test:changed diffs the PR head against its base ref, so it needs the
          # full history and the base branch — same reason the fallow-audit job
          # fetches everything.
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@8ecb39174989ce55af90f45cf55b02738599831d
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile --ignore-scripts && vp config

      - name: Run the DB-free suites (changed on PRs, all on main)
        # On a PR, `test:changed --ci` runs only the workspaces the diff touched
        # plus their dependents — a root/shared change still falls back to the
        # full suite. On a push to `main` (no base ref) it runs the full DB-free
        # `test:ci`. Either way the task substitution is identical: scan packages
        # use their DB-free `test:unit`, and react-router runs its coverage
        # `test:ci` last so it emits coverage-summary.json for the step below.
        # (When a PR skips react-router, the coverage step degrades gracefully —
        # it filters absent summaries out.)
        env:
          TEST_CHANGED_BASE: origin/${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            vp run test:changed -- --ci
          else
            vp run test:ci
          fi

      - name: Test selection summary
        # Make the change-based selection visible instead of buried in the test
        # log: the per-workspace "running / skipped" breakdown goes to the job
        # summary and (below) a sticky PR comment, so a reviewer can see exactly
        # what was checked and what was skipped. Report-only — runs no tests.
        if: github.event_name == 'pull_request' && always()
        env:
          TEST_CHANGED_BASE: origin/${{ github.base_ref }}
        run: |
          bash scripts/changed-files.sh \
            node scripts/test-changed.mjs --ci --markdown \
            | tee test-selection.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post test selection to PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const path = './test-selection.md';
            if (!fs.existsSync(path)) return;
            const body = fs.readFileSync(path, 'utf-8').trim();
            if (!body) return;

            const marker = '## 🧪 Test Selection';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.login === 'github-actions[bot]' && c.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Per-workspace + monorepo coverage report
        # Builds coverage/monorepo-coverage-summary.json — one entry per reported
        # workspace (ui, server, react-router) plus an aggregated total —
        # which the PR-comment step renders as a matrix. Best-effort and
        # `always()`: the test step above is the authoritative pass/fail gate, so a
        # coverage hiccup here must not fail the job, and a partial report on a
        # test failure is more useful than none. It re-runs test:coverage for the
        # package workspaces (their test run above is plain `test`, no coverage)
        # and reuses react-router's fresh summary.
        #
        # On a PR it scopes to the same changed workspaces the test step ran
        # (`--changed`), so an unrelated PR doesn't re-run coverage that was
        # skipped; pushes to main report every workspace.
        if: always()
        env:
          TEST_CHANGED_BASE: origin/${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash scripts/changed-files.sh node scripts/coverage-report.mjs --changed
          else
            vp run coverage:report
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: |
            ./coverage/monorepo-coverage-summary.json
            ./apps/react-router/coverage/coverage-summary.json
            ./coverage/coverage-summary.json
          if-no-files-found: ignore
          compression-level: 9
          retention-days: 3

      - name: Post coverage summary to PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');

            const fmt = (v) => `${v.pct.toFixed(1)}% (${v.covered}/${v.total})`;
            const badge = (pct) => pct >= 80 ? '✅' : pct >= 60 ? '⚠️' : '❌';
            const cell = (v, bold) => {
              const text = `${badge(v.pct)} ${fmt(v)}`;
              return bold ? `**${text}**` : text;
            };
            // The run summary page is where artifacts are downloadable; GitHub
            // exposes no stable direct URL for an artifact by name.
            const runLink = `[run summary](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

            // Preferred: the per-workspace + monorepo matrix from coverage-report.mjs.
            const buildMatrix = () => {
              const path = './coverage/monorepo-coverage-summary.json';
              if (!fs.existsSync(path)) return null;
              const report = JSON.parse(fs.readFileSync(path, 'utf-8'));
              const row = (label, total, bold = false) =>
                `| ${label} | ${cell(total.lines, bold)} | ${cell(total.statements, bold)} | ${cell(total.functions, bold)} | ${cell(total.branches, bold)} |`;
              return [
                '## 📊 Coverage Report',
                '',
                'Per-workspace and monorepo-wide coverage from this run.',
                '',
                '| Workspace | Lines | Statements | Functions | Branches |',
                '|-----------|-------|------------|-----------|----------|',
                ...report.workspaces.map((w) => row(`\`${w.name}\``, w.total)),
                row('**🏛 Monorepo total**', report.total, true),
                '',
                `> 📁 Coverage summary JSON is attached to this run as the \`coverage-report\` artifact: ${runLink}`,
              ].join('\n');
            };

            // Fallback: the legacy single-workspace table, so the comment never
            // regresses to nothing if the matrix file is absent.
            const buildLegacy = () => {
              const path = ['./apps/react-router/coverage/coverage-summary.json', './coverage/coverage-summary.json']
                .find((p) => fs.existsSync(p));
              if (!path) return null;
              const total = JSON.parse(fs.readFileSync(path, 'utf-8')).total;
              return [
                '## 📊 Coverage Report',
                '',
                '| Metric | Coverage | Status |',
                '|--------|----------|--------|',
                `| Lines | ${fmt(total.lines)} | ${badge(total.lines.pct)} |`,
                `| Statements | ${fmt(total.statements)} | ${badge(total.statements.pct)} |`,
                `| Functions | ${fmt(total.functions)} | ${badge(total.functions.pct)} |`,
                `| Branches | ${fmt(total.branches)} | ${badge(total.branches.pct)} |`,
                '',
                `> 📁 Coverage summary JSON is attached to this run as the \`coverage-report\` artifact: ${runLink}`,
              ].join('\n');
            };

            const body = buildMatrix() ?? buildLegacy();
            if (!body) {
              console.log('No coverage summary found, skipping comment');
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes('## 📊 Coverage Report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
