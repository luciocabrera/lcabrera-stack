name: Check Safe

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  quality-gate:
    name: Quality Gate (Format · Lint · Types)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@8ecb39174989ce55af90f45cf55b02738599831d
        with:
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile --ignore-scripts && vp config

      - name: Generate route types & build ESLint rules
        id: preflight
        run: vp run typegen:all && vp run --filter eslint-local-rules-shared build

      - name: Format · Lint · Type-check
        id: quality_gate
        run: vp check

      - name: TypeScript project type-check (tsc)
        id: typecheck_gate
        # `vp check`'s type pass is tsgolint driving each workspace's
        # tsconfig — close to tsc, but not tsc, and it knows nothing about
        # the per-workspace `typecheck` scripts. Those scripts carry work
        # tsgolint does not do: packages/ui gates its public API against
        # server-only node:* imports (check:public-api), and the React Router
        # apps regenerate route types before checking. Running the real
        # compiler here is the reference implementation the other passes are
        # approximations of.
        run: vp run typecheck:all

      - name: ESLint custom-rules pass
        id: eslint_gate
        # `vp check` is fmt + Oxlint + the tsgolint type pass only — it does not
        # know about the per-workspace eslint pass, so eslint-only findings
        # (perfectionist import/module ordering, the react/stylex rule sets,
        # local-rules) would otherwise never fail a PR. Inherited debt stays
        # baselined in each workspace's eslint-suppressions.json; this gates new
        # violations.
        run: vp run -r lint:eslint:check

      - name: Biome lint pass
        id: biome_gate
        # Third linter, and the only one that covers the React-domain rules the
        # other two miss (noNestedComponentDefinitions, noDuplicatedSpreadProps).
        # Config: biome.jsonc at the root — ONE repo-wide pass like Oxlint, not a
        # per-workspace fan-out, because `overrides` already scopes the react
        # domain to the three React workspaces. Biome's formatter and assist are
        # off there: Oxfmt owns formatting and perfectionist owns import order,
        # and letting Biome touch either restarts the formatter/linter fight.
        #
        # This mirrors the local pre-commit hook (`staged` block in the root
        # vite.config.ts) — the hook only sees staged files, so this is what
        # catches a violation that arrives via an unhooked push or --no-verify.
        run: vp run lint:biome:check

      - name: COMMANDS.md is still true
        id: commands_gate
        # Every other claim this repo makes has a machine behind it — types,
        # lint, format, dead code, tests. Documentation was the one class that
        # failed nothing, and it rotted accordingly: seven undocumented root
        # scripts, a README telling people to run `vp run seed` from the root
        # (not a root script), an "all 15 workspaces" count that was 16, and a
        # claudelint apparatus documented as working while the binary did not
        # exist on npm at all.
        #
        # Ground truth is `vp run`'s own task list, so this sees tasks from all
        # three sources (package.json scripts, vite.config.ts run.tasks, shared
        # @repo/vite-configs factories) instead of re-implementing resolution.
        run: vp run commands:verify

      - name: Write quality summary
        if: always()
        run: |
          if [[ "${{ steps.quality_gate.outcome }}" == "success" ]]; then
            CHECK_STATUS="✅ Passed"
          else
            CHECK_STATUS="❌ Failed"
          fi

          if [[ "${{ steps.eslint_gate.outcome }}" == "success" ]]; then
            ESLINT_STATUS="✅ Passed"
          else
            ESLINT_STATUS="❌ Failed"
          fi

          if [[ "${{ steps.biome_gate.outcome }}" == "success" ]]; then
            BIOME_STATUS="✅ Passed"
          else
            BIOME_STATUS="❌ Failed"
          fi

          if [[ "${{ steps.typecheck_gate.outcome }}" == "success" ]]; then
            TYPECHECK_STATUS="✅ Passed"
          else
            TYPECHECK_STATUS="❌ Failed"
          fi

          if [[ "${{ steps.commands_gate.outcome }}" == "success" ]]; then
            COMMANDS_STATUS="✅ Passed"
          else
            COMMANDS_STATUS="❌ Failed"
          fi

          if [[ "${{ steps.preflight.outcome }}" == "success" ]]; then
            PREFLIGHT_STATUS="✅ Passed"
          else
            PREFLIGHT_STATUS="❌ Failed"
          fi

          echo "## 🔍 Quality Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Typegen + ESLint Rules Build | $PREFLIGHT_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Format | $CHECK_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint (Oxlint) | $CHECK_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint (ESLint custom rules) | $ESLINT_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint (Biome · react domain) | $BIOME_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| TypeScript (tsgolint via vp check) | $CHECK_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| TypeScript (tsc · every workspace) | $TYPECHECK_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| COMMANDS.md accuracy | $COMMANDS_STATUS |" >> "$GITHUB_STEP_SUMMARY"

  fallow-audit:
    name: Fallow Audit (new-only gate)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # fallow audit diffs against the PR base ref, so it needs history
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@8ecb39174989ce55af90f45cf55b02738599831d
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile --ignore-scripts && vp config

      - name: Generate route types
        run: vp run typegen:all

      - name: Coverage for the DB-free suites
        # Feeds `fallow audit --coverage` real numbers. Without them fallow
        # ESTIMATES coverage from whether a colocated test file exists (none →
        # 0%), and since CRAP is cyclomatic² × (1 − coverage)³ + cyclomatic
        # against a threshold of 30, every function with cyclomatic >= 5 would
        # fail the gate on complexity it does not have.
        #
        # DB-free suites ONLY — this job has no Postgres, and that is exactly
        # what broke the previous attempt at this (reverted 2026-07-14):
        # scan-ingestion's queries/* tests call getPool() → readEnvConfig(),
        # which throws on the missing DB_*. See scripts/merge-coverage.mjs.
        run: vp run coverage:merge

      - name: Fallow audit vs base branch
        id: fallow_audit
        # Gate mode, severity mapping, and baselines come from .fallowrc.json
        # (audit.gate: new-only) — only newly-introduced dead code, complexity,
        # or duplication fails this step (exit 1). Exit 2 = runtime/config error.
        run: |
          set -o pipefail
          STATUS=0
          vp run fallow:audit --base "origin/${{ github.base_ref }}" --coverage reports/fallow/coverage/coverage-final.json --format json --quiet | tee fallow-audit.raw.txt || STATUS=$?
          # vp run echoes a command banner before the JSON — keep everything
          # from the first JSON line onward so the summary step can parse it,
          # then propagate fallow's exit code (1 = introduced issues, 2 = error).
          awk 'found || /^[{[]/ {found=1; print}' fallow-audit.raw.txt > fallow-audit.json
          exit $STATUS

      - name: Write fallow summary
        if: always()
        run: |
          {
            echo "## 🌾 Fallow Audit"
            echo ""
            if [[ -s fallow-audit.json ]] && jq -e . fallow-audit.json > /dev/null 2>&1; then
              VERDICT=$(jq -r '.verdict // "unknown"' fallow-audit.json)
              case "$VERDICT" in
                pass) BADGE="✅" ;;
                warn) BADGE="⚠️" ;;
                *)    BADGE="❌" ;;
              esac
              echo "| Field | Value |"
              echo "|-------|-------|"
              echo "| Verdict | $BADGE $VERDICT |"
              echo "| Base | \`origin/${{ github.base_ref }}\` |"
              echo "| Dead code introduced | $(jq -r '.attribution.dead_code_introduced // "n/a"' fallow-audit.json) |"
              echo "| Complexity introduced | $(jq -r '.attribution.complexity_introduced // "n/a"' fallow-audit.json) |"
              echo "| Duplication introduced | $(jq -r '.attribution.duplication_introduced // "n/a"' fallow-audit.json) |"
              echo "| Coverage source | $(jq -r '.complexity.summary.coverage_source_consistency // "n/a"' fallow-audit.json) |"
              echo ""
              echo "> Gate \`new-only\`: only newly-introduced issues fail this job. Inherited findings are covered by \`reports/fallow/baselines/\`."
              echo "> Coverage source \`mixed\` is expected: real Istanbul coverage is fed for the DB-free suites, and files with no tests at all still fall back to fallow's static estimate (which guesses 0% and inflates their CRAP)."
            else
              echo "❌ Audit did not produce JSON output — check the job log (exit 2 usually means an invalid base ref or config error)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@8ecb39174989ce55af90f45cf55b02738599831d
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile --ignore-scripts && vp config

      - name: Run the DB-free suites (every workspace) + showcase coverage
        # This job has no Postgres, so `test:ci` runs every DB-free suite:
        # all workspaces except scan-orchestrator (real CQMS queue), plus
        # scan-ingestion's DB-free `test:unit` subset, then react-router's
        # `test:ci` last so the coverage summary below is the fresh one.
        run: vp run test:ci

      - name: Upload coverage report
        if: always() && vars.ENABLE_ARTIFACT_UPLOADS == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: |
            ./apps/react-router/coverage/coverage-summary.json
            ./coverage/coverage-summary.json
          if-no-files-found: ignore
          compression-level: 9
          retention-days: 3

      - name: Post coverage summary to PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const candidateSummaryPaths = [
              './apps/react-router/coverage/coverage-summary.json',
              './coverage/coverage-summary.json',
            ];
            const summaryPath = candidateSummaryPaths.find(path => fs.existsSync(path));

            if (!summaryPath) {
              console.log('No coverage-summary.json found, skipping comment');
              return;
            }

            const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf-8'));
            const total = summary.total;

            const fmt = (v) => `${v.pct.toFixed(1)}% (${v.covered}/${v.total})`;
            const badge = (pct) => pct >= 80 ? '✅' : pct >= 60 ? '⚠️' : '❌';

            const body = [
              '## 📊 Coverage Report',
              '',
              '| Metric | Coverage | Status |',
              '|--------|----------|--------|',
              `| Lines | ${fmt(total.lines)} | ${badge(total.lines.pct)} |`,
              `| Statements | ${fmt(total.statements)} | ${badge(total.statements.pct)} |`,
              `| Functions | ${fmt(total.functions)} | ${badge(total.functions.pct)} |`,
              `| Branches | ${fmt(total.branches)} | ${badge(total.branches.pct)} |`,
              '',
              `> 📁 Coverage summary JSON generated in this run: [workflow logs](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes('## 📊 Coverage Report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
