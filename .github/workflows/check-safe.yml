name: Check Safe

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  quality-gate:
    name: Quality Gate (Format · Lint · Types)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@8ecb39174989ce55af90f45cf55b02738599831d
        with:
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile --ignore-scripts && vp config

      - name: Generate route types & build ESLint rules
        id: preflight
        run: vp run typegen:all && vp run build:eslint-rules

      - name: Format · Lint · Type-check
        id: quality_gate
        run: vp check

      - name: Write quality summary
        if: always()
        run: |
          if [[ "${{ steps.quality_gate.outcome }}" == "success" ]]; then
            CHECK_STATUS="✅ Passed"
          else
            CHECK_STATUS="❌ Failed"
          fi

          if [[ "${{ steps.preflight.outcome }}" == "success" ]]; then
            PREFLIGHT_STATUS="✅ Passed"
          else
            PREFLIGHT_STATUS="❌ Failed"
          fi

          echo "## 🔍 Quality Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Typegen + ESLint Rules Build | $PREFLIGHT_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Format | $CHECK_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint | $CHECK_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| TypeScript | $CHECK_STATUS |" >> "$GITHUB_STEP_SUMMARY"

  fallow-audit:
    name: Fallow Audit (new-only gate)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # fallow audit diffs against the PR base ref, so it needs history
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@8ecb39174989ce55af90f45cf55b02738599831d
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile --ignore-scripts && vp config

      - name: Fallow audit vs base branch
        id: fallow_audit
        # Gate mode, severity mapping, and baselines come from .fallowrc.json
        # (audit.gate: new-only) — only newly-introduced dead code, complexity,
        # or duplication fails this step (exit 1). Exit 2 = runtime/config error.
        run: |
          set -o pipefail
          STATUS=0
          vp run fallow:audit --base "origin/${{ github.base_ref }}" --format json --quiet | tee fallow-audit.raw.txt || STATUS=$?
          # vp run echoes a command banner before the JSON — keep everything
          # from the first JSON line onward so the summary step can parse it,
          # then propagate fallow's exit code (1 = introduced issues, 2 = error).
          awk 'found || /^[{[]/ {found=1; print}' fallow-audit.raw.txt > fallow-audit.json
          exit $STATUS

      - name: Write fallow summary
        if: always()
        run: |
          {
            echo "## 🌾 Fallow Audit"
            echo ""
            if [[ -s fallow-audit.json ]] && jq -e . fallow-audit.json > /dev/null 2>&1; then
              VERDICT=$(jq -r '.verdict // "unknown"' fallow-audit.json)
              case "$VERDICT" in
                pass) BADGE="✅" ;;
                warn) BADGE="⚠️" ;;
                *)    BADGE="❌" ;;
              esac
              echo "| Field | Value |"
              echo "|-------|-------|"
              echo "| Verdict | $BADGE $VERDICT |"
              echo "| Base | \`origin/${{ github.base_ref }}\` |"
              echo "| Dead code introduced | $(jq -r '.attribution.dead_code_introduced // "n/a"' fallow-audit.json) |"
              echo "| Complexity introduced | $(jq -r '.attribution.complexity_introduced // "n/a"' fallow-audit.json) |"
              echo "| Duplication introduced | $(jq -r '.attribution.duplication_introduced // "n/a"' fallow-audit.json) |"
              echo ""
              echo "> Gate \`new-only\`: only newly-introduced issues fail this job. Inherited findings are covered by \`reports/fallow/baselines/\`."
            else
              echo "❌ Audit did not produce JSON output — check the job log (exit 2 usually means an invalid base ref or config error)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@8ecb39174989ce55af90f45cf55b02738599831d
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile --ignore-scripts && vp config

      - name: Run tests with coverage
        run: vp run test:ci

      - name: Upload coverage report
        if: always() && vars.ENABLE_ARTIFACT_UPLOADS == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: |
            ./apps/react-router/coverage/coverage-summary.json
            ./coverage/coverage-summary.json
          if-no-files-found: ignore
          compression-level: 9
          retention-days: 3

      - name: Post coverage summary to PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const candidateSummaryPaths = [
              './apps/react-router/coverage/coverage-summary.json',
              './coverage/coverage-summary.json',
            ];
            const summaryPath = candidateSummaryPaths.find(path => fs.existsSync(path));

            if (!summaryPath) {
              console.log('No coverage-summary.json found, skipping comment');
              return;
            }

            const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf-8'));
            const total = summary.total;

            const fmt = (v) => `${v.pct.toFixed(1)}% (${v.covered}/${v.total})`;
            const badge = (pct) => pct >= 80 ? '✅' : pct >= 60 ? '⚠️' : '❌';

            const body = [
              '## 📊 Coverage Report',
              '',
              '| Metric | Coverage | Status |',
              '|--------|----------|--------|',
              `| Lines | ${fmt(total.lines)} | ${badge(total.lines.pct)} |`,
              `| Statements | ${fmt(total.statements)} | ${badge(total.statements.pct)} |`,
              `| Functions | ${fmt(total.functions)} | ${badge(total.functions.pct)} |`,
              `| Branches | ${fmt(total.branches)} | ${badge(total.branches.pct)} |`,
              '',
              `> 📁 Coverage summary JSON generated in this run: [workflow logs](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes('## 📊 Coverage Report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
