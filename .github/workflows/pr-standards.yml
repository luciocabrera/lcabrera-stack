name: PR Standards

# Enforces the repo's commit + PR conventions on every pull request. The local
# .vite-hooks/commit-msg hook gives the same feedback, but it can be skipped with
# --no-verify, so this job is the real wall. Two checks, ONE spec
# (packages/repo-standards/scripts/commit-convention.mjs):
#   - the PR title + description (repo-verify-pr);
#   - every non-merge commit in the PR range (repo-verify-commit on stdin).
# `edited` re-runs the check when the title/description is changed after opening;
# without it a bad title "fixed" by an edit would keep a stale red check. Both
# scripts use only Node built-ins, so there is no workspace install step.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-standards:
    name: Commit + PR standards
    runs-on: ubuntu-latest
    steps:
      # The merge ref (actions/checkout's default for pull_request), not the PR
      # head. GitHub runs this workflow file from the merge result, so pinning
      # the checkout to the head would put the YAML and the scripts it invokes on
      # different commits — the skew that broke the Sonar gate in #177, fixed the
      # same way in #190. Nothing here needs HEAD to be the PR head: the commit
      # range comes from the event payload as BASE_SHA/HEAD_SHA below, and
      # fetch-depth 0 makes both reachable.
      - name: Check out the PR merge ref (full history for the commit range)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Validate the branch name
        # The pre-push hook checks this too, but --no-verify skips it, so this
        # is the real wall. The head ref comes from the event payload rather
        # than git, because the checkout above is the MERGE ref — HEAD there is
        # not the topic branch and would always read as exempt.
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: node packages/repo-standards/scripts/verify-branch-name.mjs

      - name: Validate PR title, description and base branch
        # Title/body/base come in through env, never a shell interpolation, so no
        # untrusted PR text can be executed. PR_BASE guards against a stacked PR
        # targeting a feature branch instead of `main` (the #367 orphaning).
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: node packages/repo-standards/scripts/verify-pr.mjs

      - name: Validate every commit message in the PR
        # --no-merges drops the Merge commits; each surviving message is piped to
        # the same validator the commit-msg hook uses. All bad commits are
        # reported before the step fails.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          status=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            # By path, not through the task runner or a bin: this workflow
            # runs without installing, and these gates import nothing outside
            # node builtins and their own siblings so they need no install.
            if ! git log -1 --format=%B "$sha" | node packages/repo-standards/scripts/verify-commit-msg.mjs -; then
              echo "::error::commit $sha has a non-conforming message"
              status=1
            fi
          done
          exit $status
