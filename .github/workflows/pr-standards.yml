name: PR Standards

# Enforces the repo's commit + PR conventions on every pull request. The local
# .vite-hooks/commit-msg hook gives the same feedback, but it can be skipped with
# --no-verify, so this job is the real wall. Three checks, ONE spec
# (packages/repo-standards/scripts/commit-convention.mjs):
#   - the head branch name (verify-branch-name.mjs);
#   - the PR title + description (repo-verify-pr);
#   - every non-merge commit in the range (repo-verify-commit on stdin).
# `edited` re-runs the check when the title/description is changed after opening;
# without it a bad title "fixed" by an edit would keep a stale red check. All
# three scripts use only Node built-ins, so there is no workspace install step.
#
# It reports inside the merge queue too, where there is no `pull_request` payload
# to read any of that from. Every input comes instead from
# scripts/resolve-subject-pr.mjs, which resolves the same facts from the merge
# group's ref — so the three checks below have one form and cannot drift between
# the two events. See docs/tooling/merge-queue.md.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  # Only the queue run uses it: it has to read the pull request the merge group
  # names, because the payload does not carry one.
  pull-requests: read

jobs:
  pr-standards:
    name: Commit + PR standards
    runs-on: ubuntu-latest
    steps:
      # The merge ref (actions/checkout's default for pull_request) or the merge
      # group, never the pull request head. GitHub runs this workflow file from
      # the merge result, so pinning the checkout to the head would put the YAML
      # and the scripts it invokes on different commits — the skew that broke the
      # Sonar gate in #177, fixed the same way in #190. Nothing here needs HEAD to
      # be the topic branch: the commit range arrives as RANGE_BASE_SHA and
      # RANGE_HEAD_SHA below, and fetch-depth 0 makes both reachable.
      - name: Check out the ref this event runs from (full history for the range)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Which pull request this run answers for, and over what range. Every step
      # below reads what this exports, so neither event has its own copy of "what
      # is being checked" to get wrong. It fails rather than defaulting: a gate
      # that cannot name its subject would check nothing and report green.
      - name: Resolve the pull request this run answers for
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/resolve-subject-pr.mjs

      - name: Validate the branch name
        # The pre-push hook checks this too, but --no-verify skips it, so this
        # is the real wall. BRANCH_NAME is the pull request's head ref, never
        # git's HEAD — the checkout above is a merge ref or a queue branch, and
        # in both cases HEAD is not the topic branch. In the queue it would be
        # `gh-readonly-queue/…`, which is not a shape this convention allows.
        run: node packages/repo-standards/scripts/verify-branch-name.mjs

      - name: Validate PR title, description and base branch
        # Title/body/base arrive in the environment, never a shell
        # interpolation, so no untrusted PR text can be executed. PR_BASE guards
        # against a stacked PR targeting a feature branch instead of `main` (the
        # #367 orphaning).
        run: node packages/repo-standards/scripts/verify-pr.mjs

      - name: Validate every commit message in the range
        # --no-merges drops the Merge commits; each surviving message is piped to
        # the same validator the commit-msg hook uses. All bad commits are
        # reported before the step fails. In the queue the range is the merge
        # group's parent..the merge group, which walks this entry's own commits
        # and none of the entries ahead of it — each of those is validated by its
        # own build.
        run: |
          set -o pipefail
          status=0
          for sha in $(git rev-list --no-merges "$RANGE_BASE_SHA..$RANGE_HEAD_SHA"); do
            # By path, not through the task runner or a bin: this workflow
            # runs without installing, and these gates import nothing outside
            # node builtins and their own siblings so they need no install.
            if ! git log -1 --format=%B "$sha" | node packages/repo-standards/scripts/verify-commit-msg.mjs -; then
              echo "::error::commit $sha has a non-conforming message"
              status=1
            fi
          done
          exit $status
