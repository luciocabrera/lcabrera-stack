name: PR Standards

# Enforces the repo's commit + PR conventions on every pull request. The local
# .vite-hooks/commit-msg hook gives the same feedback, but it can be skipped with
# --no-verify, so this job is the real wall. Two checks, ONE spec
# (scripts/lib/commit-convention.mjs):
#   - the PR title + description (verify-pr.mjs);
#   - every non-merge commit in the PR range (verify-commit-msg.mjs on stdin).
# `edited` re-runs the check when the title/description is changed after opening;
# without it a bad title "fixed" by an edit would keep a stale red check. Both
# scripts use only Node built-ins, so there is no workspace install step.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-standards:
    name: Commit + PR standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head (full history for the commit range)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate PR title and description
        # Title/body come in through env, never a shell interpolation, so no
        # untrusted PR text can be executed.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/verify-pr.mjs

      - name: Validate every commit message in the PR
        # --no-merges drops the Merge commits; each surviving message is piped to
        # the same validator the commit-msg hook uses. All bad commits are
        # reported before the step fails.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          status=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            if ! git log -1 --format=%B "$sha" | node scripts/verify-commit-msg.mjs -; then
              echo "::error::commit $sha has a non-conforming message"
              status=1
            fi
          done
          exit $status
