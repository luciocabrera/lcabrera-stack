name: Agent Evals

# Why there is no `paths:` filter: COMMANDS.md §6.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deterministic:
    name: Agent Evals (deterministic)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile --ignore-scripts && vp config

      - name: Eval suites
        run: vp run test:evals

      - name: Rules agree with the index and the tree
        run: vp run evals:rules:verify

      - name: Install Waza
        env:
          WAZA_SHA256: e227cd884173de796bc28c6cb1828498f250297e0e606a4e4504d14465ff879f
          WAZA_TAG: v0.38.7
        run: |
          mkdir -p "$RUNNER_TEMP/waza"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/waza/waza" \
            "https://github.com/microsoft/waza/releases/download/$WAZA_TAG/waza-linux-amd64"
          echo "$WAZA_SHA256  $RUNNER_TEMP/waza/waza" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/waza/waza"
          echo "$RUNNER_TEMP/waza" >> "$GITHUB_PATH"

      - name: Skill frontmatter parses
        run: |
          checked=0
          status=0
          for skill in .github/skills/*/; do
            [ -f "${skill}SKILL.md" ] || continue
            checked=$((checked + 1))
            if ! report=$(waza check "$skill" --no-update-check 2>&1); then
              echo "::error file=${skill}SKILL.md::waza check could not parse this skill"
              echo "$report"
              status=1
            fi
          done
          echo "waza check read $checked skill(s)"
          if [ "$checked" -eq 0 ]; then
            echo "::error::no SKILL.md found under .github/skills"
            exit 1
          fi
          exit "$status"

      - name: Every skill has trigger evals
        run: vp run evals:skills -- --check

  skill-triggers:
    name: Skill triggers (Claude)
    concurrency:
      group: skill-triggers-${{ github.ref }}
      cancel-in-progress: true
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile --ignore-scripts && vp config

      - name: Trigger and near-miss tasks
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: vp run evals:skills

      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: skill-trigger-transcripts
          path: .tmp/skill-evals/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload envelopes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eval-envelopes-skills
          path: .tmp/eval-results/
          if-no-files-found: ignore
          retention-days: 90

      - name: Ingest envelopes (advisory)
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        env:
          EVALS_DATABASE_URL: ${{ secrets.EVALS_DATABASE_URL }}
        run: |
          if [ -z "$EVALS_DATABASE_URL" ]; then
            echo "::notice title=Eval history::EVALS_DATABASE_URL is not set, so ingest is skipped; the envelopes are in the eval-envelopes-skills artifact."
            exit 0
          fi
          if [ ! -d .tmp/eval-results ]; then
            echo "::notice title=Eval history::No envelope was written under .tmp/eval-results, so there is nothing to ingest."
            exit 0
          fi
          if ! vp run evals:ingest -- .tmp/eval-results; then
            echo "::warning title=Eval history::evals:ingest did not store every envelope; they are in the eval-envelopes-skills artifact, and vp run evals:ingest sends a downloaded copy."
          fi

  verifier-fixtures:
    name: Verifier fixtures (Claude, advisory)
    concurrency:
      group: verifier-fixtures-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Did the verifier's inputs change
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! CHANGED="$(git diff --name-only "origin/$BASE_REF...HEAD" 2>/dev/null)"; then
            echo "::notice::Diff range origin/$BASE_REF...HEAD unresolvable, so running the fixtures."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$CHANGED" |
            grep -qE '^(\.claude/agents/refactor-verifier\.md|docs/agents/refactor-verified-contract\.md|evals/verifier-fixtures/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Vite+
        if: steps.scope.outputs.run == 'true'
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          cache: false
          run-install: false

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: vp install --frozen-lockfile --ignore-scripts && vp config

      - name: Verifier verdicts on the fixtures
        if: steps.scope.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: vp run evals:verifier

      - name: Upload reports
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verifier-fixture-reports
          path: .tmp/verifier-evals/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload envelopes
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eval-envelopes-verifier-fixtures
          path: .tmp/eval-results/
          if-no-files-found: ignore
          retention-days: 90

      - name: Ingest envelopes (advisory)
        if: always() && steps.scope.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          EVALS_DATABASE_URL: ${{ secrets.EVALS_DATABASE_URL }}
        run: |
          if [ -z "$EVALS_DATABASE_URL" ]; then
            echo "::notice title=Eval history::EVALS_DATABASE_URL is not set, so ingest is skipped; the envelopes are in the eval-envelopes-verifier-fixtures artifact."
            exit 0
          fi
          if [ ! -d .tmp/eval-results ]; then
            echo "::notice title=Eval history::No envelope was written under .tmp/eval-results, so there is nothing to ingest."
            exit 0
          fi
          if ! vp run evals:ingest -- .tmp/eval-results; then
            echo "::warning title=Eval history::evals:ingest did not store every envelope; they are in the eval-envelopes-verifier-fixtures artifact, and vp run evals:ingest sends a downloaded copy."
          fi

  eval-report:
    name: Eval report (Claude, advisory)
    concurrency:
      group: eval-report-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile --ignore-scripts && vp config

      - name: Which skills the change reaches
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node evals/pr-report/select-skills.mjs --base "origin/$BASE_REF" >> "$GITHUB_OUTPUT"

      - name: Skill triggers on the changed skills
        id: run
        if: steps.scope.outputs.scope == 'some' || steps.scope.outputs.scope == 'all'
        continue-on-error: true
        timeout-minutes: 90
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SKILLS: ${{ steps.scope.outputs.skills }}
        run: |
          read -r -a selected <<< "$SKILLS"
          vp run evals:skills -- "${selected[@]}"

      - name: Upload envelopes
        if: always() && steps.run.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eval-envelopes-skills
          path: .tmp/eval-results/
          if-no-files-found: ignore
          retention-days: 90

      - name: Ingest envelopes (advisory)
        if: always() && steps.run.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 5
        env:
          EVALS_DATABASE_URL: ${{ secrets.EVALS_DATABASE_URL }}
        run: |
          if [ -z "$EVALS_DATABASE_URL" ]; then
            echo "::notice title=Eval history::EVALS_DATABASE_URL is not set, so ingest is skipped; the envelopes are in the eval-envelopes-skills artifact."
            exit 0
          fi
          if [ ! -d .tmp/eval-results ]; then
            echo "::notice title=Eval history::No envelope was written under .tmp/eval-results, so there is nothing to ingest."
            exit 0
          fi
          if ! vp run evals:ingest -- .tmp/eval-results; then
            echo "::warning title=Eval history::evals:ingest did not store every envelope; they are in the eval-envelopes-skills artifact, and vp run evals:ingest sends a downloaded copy."
          fi

      - name: Main's newest skills envelope
        if: always() && steps.run.outcome != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          artifact="$(gh api --paginate \
            "repos/$REPO/actions/artifacts?name=eval-envelopes-skills&per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main") | [.created_at, .id] | @tsv' \
            | sort -r | head -n 1 | cut -f 2)"
          if [ -z "$artifact" ]; then
            echo "::notice title=Eval report::main has no unexpired eval-envelopes-skills artifact to compare against."
            exit 0
          fi
          gh api "repos/$REPO/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/main-envelopes.zip"
          mkdir -p "$RUNNER_TEMP/main-envelopes"
          unzip -q -o "$RUNNER_TEMP/main-envelopes.zip" -d "$RUNNER_TEMP/main-envelopes"

      - name: Write the report
        id: report
        if: always() && steps.scope.outputs.scope != 'out' && steps.scope.outcome == 'success'
        env:
          EVALS_DATABASE_URL: ${{ secrets.EVALS_DATABASE_URL }}
          SCOPE: ${{ steps.scope.outputs.scope }}
          SKILLS: ${{ steps.scope.outputs.skills }}
        run: |
          read -r -a selected <<< "$SKILLS"
          skill_args=()
          for skill in "${selected[@]}"; do
            skill_args+=(--skill "$skill")
          done
          node evals/pr-report/write-comment.mjs --scope "$SCOPE" "${skill_args[@]}" \
            --pr-results .tmp/eval-results \
            --main-results "$RUNNER_TEMP/main-envelopes" \
            > "$RUNNER_TEMP/eval-report.md"
          cat "$RUNNER_TEMP/eval-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update the PR comment
        if: always() && steps.report.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: node evals/pr-report/upsert-comment.mjs --repo "$REPO" --pr "$PR_NUMBER" --body-file "$RUNNER_TEMP/eval-report.md"
