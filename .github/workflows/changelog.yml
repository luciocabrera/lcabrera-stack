name: Release Changelog

# On a v* tag push, generate the changelog section for that release and publish it
# as the GitHub Release notes. Releases aren't branch-protected, so this never
# fights the `main` ruleset. The CHANGELOG.md file itself is maintained via
# `vp run changelog:generate` in ordinary PRs.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release-notes:
    name: Publish release notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the changelog range)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Generate the tag's notes and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git log --no-merges --format=%H%x1f%D%x1f%cI%x1f%s%x1f%b%x1e \
            | node scripts/generate-changelog.mjs --release "$TAG" > release-notes.md
          if [ -s release-notes.md ]; then
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md \
              || gh release edit "$TAG" --notes-file release-notes.md
          else
            echo "No changelog entries for $TAG — skipping release notes."
          fi
