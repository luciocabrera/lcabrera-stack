name: Release Changelog

# On a v* tag push, generate the changelog section for that release and publish it
# as the GitHub Release notes. This reads `git log` directly and never opens
# CHANGELOG.md, so it is unaffected by how that file is maintained. Releases
# aren't branch-protected either, so this never fights the `main` ruleset.
#
# CHANGELOG.md itself is regenerated with `vp run changelog:generate` and
# committed through an ordinary PR. A bot pushing it straight to `main` after
# each merge was tried and removed — see AGENTS.md § Changelog & Labels.
#
# This is the REPOSITORY release, and nothing creates its tags automatically.
# Package releases are a separate track: Changesets tags each package as
# `@lcabrera/utils@0.1.0` and `release.yml` opens a GitHub Release per package, so
# that flow never produces a `v*` tag and never triggers this workflow. Push a
# `v*` tag by hand to mark a monorepo milestone — which is also the only thing
# that gives CHANGELOG.md more than one section, since it splits on those tags.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release-notes:
    name: Publish release notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the changelog range)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Generate the tag's notes and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git log --no-merges --format=%H%x1f%D%x1f%cI%x1f%s%x1f%b%x1e -- ':!CHANGELOG.md' \
            | node scripts/generate-changelog.mjs --release "$TAG" > release-notes.md
          if [ -s release-notes.md ]; then
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md \
              || gh release edit "$TAG" --notes-file release-notes.md
          else
            echo "No changelog entries for $TAG — skipping release notes."
          fi
