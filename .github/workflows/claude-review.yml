name: Claude Review

# A second AI reviewer, running in-workflow, alongside the Copilot code review bot
# requested by ruleset 19141543. Neither one supersedes the other: this file only posts a
# review, and copilot-review-gate.yml decides — for both reviewers, identically — whether
# the newest accepted review names the head.
#
# Deliberately does NOT publish a commit status. Two writers to one status context can
# disagree about the head, which is the exact failure the gate was built to make visible.
# Publication stays single-writer in scripts/copilot-review-status.mjs.
#
# `synchronize` is what makes this useful: it fires on every push, so the review that
# lands is against the head that triggered it.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

# Unlike copilot-review-gate.yml, this job DOES want cancel-in-progress, and the reason is
# the same property that rules it out there. The gate re-reads the head and the reviews
# together and posts against the head it read, so a slow run cannot disagree with a fast
# one. This job instead carries the SHA of the event that triggered it across the whole
# run, so a superseded run produces a review of dead code — and pays real tokens to do it.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts are excluded to match the gate's treatment of `converted_to_draft`.
    if: github.event.pull_request.draft == false
    name: Review the pull request with Claude
    runs-on: ubuntu-latest
    steps:
      - name: Check out the merge ref for this pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Fork pull requests receive an empty ANTHROPIC_API_KEY — secrets are not exposed to
      # them — so the action exits without spending credits and no review is posted. That
      # is fail-closed and matches the gate's existing fork behaviour, where the status is
      # absent rather than red. It is NOT to be "fixed" with pull_request_target in this
      # change; that trades a documented absence for secret exposure on untrusted code.
      - name: Run the Claude review
        uses: anthropics/claude-code-action@5ee796a55f92566ecd7e39d70dd613abcbea0d7c # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          # `/review` was the first shape tried and it posts nothing: the action carries no
          # `slash-commands` directory at this pin, so an unknown command expands to nothing
          # and the run ends at `num_turns: 0` having spent nothing. A green check that
          # reviewed nothing is the worst outcome available here — it reads exactly like a
          # review that found nothing — so the prompt below is explicit that posting is the
          # job, not a side effect of having found something.
          prompt: |
            Review the changes in pull request #${{ github.event.pull_request.number }}
            of ${{ github.repository }}.

            Read the diff with `gh pr diff ${{ github.event.pull_request.number }}`, and read
            whatever else you need for context. Judge correctness first, then whether the
            change fits the conventions the surrounding code already follows. This repository
            states those conventions in AGENTS.md and in the rule files it points at; they are
            available to you in the checkout and they are what a finding should be measured
            against.

            Then post the review. ALWAYS post it, whether or not you found anything.

            Write the body to a file first and submit it as JSON, so that nothing in the body
            has to survive shell quoting:

                # /tmp/review.json
                # { "commit_id": "<head sha>", "event": "COMMENT", "body": "<the review>" }
                gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
                  --input /tmp/review.json

            `commit_id` must be exactly ${{ github.event.pull_request.head.sha }} — the head
            this run was triggered for. A review carrying any other commit is a review of code
            nobody asked about.

            The body is a short paragraph saying what the change does, then the findings —
            each naming a file and line, most important first. If you found nothing, say so in
            those words and keep the summary: "no findings" and "never ran" have to be
            distinguishable by anyone reading the pull request.

            Post exactly one review. Do not push commits, edit files, or open issues.
          claude_args: >-
            --model claude-opus-5
            --allowedTools "Read,Grep,Glob,Write,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*)"
