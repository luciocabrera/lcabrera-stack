name: Sync Labels

# Keeps the app:/pkg:/type: label taxonomy on GitHub in sync with its manifest.
# Runs when the label definitions or the workspace list change on main, so adding
# a workspace (or editing labels.mjs) auto-creates/updates the labels — no manual
# `vp run labels:sync`. Idempotent; creates/updates only, never deletes.
# Also runnable on demand from the Actions tab (workflow_dispatch).
#
# The `apps/*/package.json` + `packages/*/package.json` paths are what make the
# "adding a workspace" half of that true, and they are easy to leave out: the
# workspace list is NOT read from pnpm-workspace.yaml's text. That file holds the
# globs (`packages/*`), and `deriveWorkspaces` expands them against the
# filesystem — so a new workspace changes no file this filter used to watch, and
# this workflow never fired for one. Both `pkg: api` and `pkg: server` had to be
# created by hand. A workspace manifest appearing or disappearing is the only
# on-disk signal that the set changed; watch it, not the globs.

on:
  push:
    branches: [main]
    paths:
      - scripts/lib/labels.mjs
      - scripts/sync-labels.mjs
      - packages/repo-standards/scripts/workspace-scopes.mjs
      - pnpm-workspace.yaml
      - apps/*/package.json
      - packages/*/package.json
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    name: Sync labels from the manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Sync labels
        # sync-labels.mjs uses only Node built-ins + the REST API via fetch; the
        # runner sets GITHUB_TOKEN and GITHUB_REPOSITORY.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-labels.mjs
