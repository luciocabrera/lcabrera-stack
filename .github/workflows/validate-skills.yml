name: Validate Skills

on:
  # No `paths:` filter. The script-path check reaches files this workflow does
  # not own (e.g. a runner in another workspace). Filtering on
  # the referencing skill/agent would miss a move or deletion of the target —
  # the direction the fallow-scan stale path actually ran.
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  skills-contract:
    name: Skills Contract and Report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile --ignore-scripts && vp config

      - name: Validate skill contracts
        run: node scripts/validate-skills.cjs

      - name: Generate markdown compliance report
        run: node scripts/generate-skills-compliance-report.cjs

      - name: Upload skill compliance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: skills-compliance-report
          path: |
            reports/skills/code-smell-compliance-report.md
            reports/skills/agenting-plan-progress.md
          if-no-files-found: ignore
          compression-level: 9
          retention-days: 3
