name: Secret Scan

# Scans repository CONTENT for credentials — the layer the two existing guards
# does not cover. `scripts/claude-secrets-guard.mjs`
# (ADR-020) both sit at the AGENT boundary; neither looks at what lands in a
# commit, so a human, a different agent, or anyone using `--no-verify` could add
# one. This repository is public, so a committed token is public on push.
#
# This is the SECOND of two layers — see issue #218. The first is GitHub's own
# secret scanning with push protection: free for public repos, server-side, and
# it blocks the push BEFORE the secret reaches the remote, which no local hook
# here can do. That one is a repository setting rather than code. This job
# catches what GitHub's provider patterns do not: repo-specific shapes and bare
# high-entropy strings.
#
# Two scans, each answering a different question:
#   dir  — does the tree, as it stands, contain a secret?
#   git  — did any commit in THIS PR introduce one, even if a later commit in
#          the same PR removed it? (The branch was still pushed with it.)
#
# History was audited once at adoption: 1414 commits, zero real secrets. It is
# deliberately not rescanned per PR — history is immutable, so a hit there would
# fail every PR forever, and a gate that cries wolf gets bypassed.
#
# The binary is downloaded at a pinned version and CHECKSUM-VERIFIED rather than
# using a third-party action: this is a security control, and an unpinned action
# would be a supply-chain dependency inside it.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.28.0
  GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the commit-range scan can see the PR's base.
          fetch-depth: 0

      - name: Install gitleaks (pinned + checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # --proto '=https' --tlsv1.2 pin the transport across the redirect
          # chain too: -L follows redirects, and without this a hop could
          # downgrade to plaintext. The checksum below would still catch a
          # tampered archive, but not before it was fetched over cleartext.
          curl --proto '=https' --tlsv1.2 -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" gitleaks
          ./gitleaks version

      - name: Scan the working tree
        run: ./gitleaks dir . --no-banner --redact --exit-code 1

      # Only on a pull request: a secret added and then removed within the same
      # PR never appears in the tree, but the branch carrying it was pushed.
      - name: Scan the commits this PR adds
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ./gitleaks git . --no-banner --redact --exit-code 1 \
            --log-opts="${BASE_SHA}..${HEAD_SHA}"
