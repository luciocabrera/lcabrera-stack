packages:
  - apps/*
  - packages/*

# Refuse to install on a Node outside the root `engines.node` band. Without this
# the field is advisory: pnpm ignores it, nothing else reads it, and an install
# on an unsupported runtime proceeds silently. The band is deliberately wider
# than `.node-version`, so a patch release does not hard-fail every install
# before someone moves the pin.
engineStrict: true

# A workspace dependency cycle is an architecture error; make it fail the
# install rather than the default warning that scrolls past unnoticed.
disallowWorkspaceCycles: true

# Supply chain security (https://pnpm.io/supply-chain-security)
blockExoticSubdeps: true

# pnpm installs no version younger than a day (`minimumReleaseAge`, 1440 minutes
# unless set). Each pattern below names the per-platform binaries a package pins
# exactly and publishes minutes after itself. For those minutes the package is a
# day old and its binaries are not, so pnpm installs them anyway and appends
# each to this list, leaving the file modified. Through its parent's exact pin a
# binary still installs only once that parent has waited the day; a package this
# tree declares itself and a pattern matches does not wait.
minimumReleaseAgeExclude:
  - '@biomejs/cli-*'
  - '@oxfmt/binding-*'
  - '@oxlint-tsgolint/*'
  - '@oxlint/binding-*'
  - '@voidzero-dev/vite-plus-darwin-*'
  - '@voidzero-dev/vite-plus-linux-*'
  - '@voidzero-dev/vite-plus-win32-*'
  - '@yuku-core/binding-*'
  - lightningcss-android-*
  - lightningcss-darwin-*
  - lightningcss-freebsd-*
  - lightningcss-linux-*
  - lightningcss-win32-*

allowBuilds:
  esbuild: true

# Dependencies are grouped by purpose (named catalogs) so a release cohort shows
# and upgrades together. Reference one from a package.json as `catalog:<group>`.
# This file is the only place a version is declared; prose repeating one is a
# second declaration nothing keeps in step.
catalogs:
  build:
    '@babel/preset-typescript': ^7.29.7
    typescript: ^6.0.3
    # `vite` is aliased to Vite+ core so the whole workspace resolves ONE Vite
    # instance; the `overrides` below redirect every `vite` edge here. Without
    # it the graph splits across separate Vite+, Vite and Vitest copies. Keep in
    # lockstep with `vite-plus` (same Vite+ release).
    vite: npm:@voidzero-dev/vite-plus-core@1.3.0
    vite-plugin-babel: ^1.7.3
    vite-plus: 1.3.0

  lint:
    '@biomejs/biome': ^2.5.11

  react:
    '@react-router/dev': ^8.3.1
    '@react-router/node': ^8.3.1
    '@react-router/serve': ^8.3.1
    '@stylexjs/stylex': ^0.19.0
    '@stylexjs/unplugin': ^0.19.0
    babel-plugin-react-compiler: ^1.0.0
    isbot: 5.2.1
    react: ^19.2.8
    react-dom: ^19.2.8
    react-router: ^8.3.1

  stack:
    '@lcabrera/tsconfig': '>=0.2.2 <1.0.0'
    '@lcabrera/vite-config': '>=0.8.0 <1.0.0'

  test:
    '@testing-library/react': ^16.3.3
    jsdom: ^30.0.1
    # Declared because the test scripts run its binary by name, and pnpm only
    # links a binary for a direct dependency.
    vitest: 5.0.5

  types:
    '@types/node': ^26.4.1
    '@types/react': ^19.2.18
    '@types/react-dom': ^19.2.5

catalogMode: prefer

# Redirect every `vite`/`vitest` edge to the toolchain catalog so the workspace
# resolves a single Vite+ instance. The core alias does not satisfy plugins'
# `vite` peer ranges, so allow any peer for these two: the single resolved
# version is the source of truth, not the range. The keys are `vite@*` and
# `vitest@*`, because a bare key also matches a `catalog:` reference and an
# upgrade rewrites that reference to a concrete version.
overrides:
  vite@*: catalog:build
  vitest@*: catalog:test

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
